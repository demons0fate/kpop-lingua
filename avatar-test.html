<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Редактор героя</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #13131f;
      color: #fff;
    }
    .editor {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #13131f;
    }

    /* Шапка как в Duo */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #13131f;
      border-bottom: 1px solid #24243a;
      flex-shrink: 0;
    }
    .topbar-btn {
      background: none;
      border: none;
      color: #9b9bb8;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .topbar-done {
      background: none;
      border: none;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      padding: 4px 6px;
    }
    .topbar-done:active { opacity: 0.7; }

    /* Большая цветная сцена во всю ширину */
    .stage {
      position: relative;
      width: 100%;
      height: 39dvh;
      min-height: 230px;
      max-height: 340px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: background-color 0.25s ease;
    }
    .stage svg {
      height: 94%;
      width: auto;
      max-width: 100%;
      display: block;
    }
    .random-fab {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(19, 19, 31, 0.55);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .random-fab:active { transform: scale(0.93); }

    /* Вкладки категорий */
    .tabs {
      display: flex;
      overflow-x: auto;
      background: #171726;
      border-bottom: 1px solid #26263d;
      padding: 0 8px;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative;
      padding: 13px 14px;
      background: none;
      border: none;
      color: #8888a8;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active {
      color: #38bdf8;
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: #38bdf8;
    }

    /* Прокручиваемая сетка снизу */
    .panel {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #a4a4c4;
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding-bottom: 24px;
    }
    .grid.colors {
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .item {
      aspect-ratio: 1;
      background: #1d1d30;
      border: 2.5px solid #2b2b45;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.1s;
    }
    .item:active { transform: scale(0.96); }
    .item.active {
      border-color: #38bdf8;
      background: #232942;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }
    .item svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .item.none {
      font-size: 14px;
      color: #8f8fb0;
      font-weight: 700;
    }

    /* Квадратные плашки цветов как в Duo */
    .item.color-card {
      padding: 5px;
      border-radius: 15px;
      background: #171726;
    }
    .swatch {
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="editor">
    <div class="topbar">
      <button class="topbar-btn" id="closeBtn">✕</button>
      <div class="topbar-title">Редактор героя</div>
      <button class="topbar-done" id="doneBtn">ГОТОВО</button>
    </div>

    <div class="stage" id="stage">
      <div id="preview" style="height:100%; display:flex; align-items:flex-end; justify-content:center;"></div>
      <button class="random-fab" id="randomBtn" title="Случайный образ">🎲</button>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="panel">
      <div class="section-title" id="sectionTitle">Волосы</div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <script type="module">
    import { createAvatar } from 'https://cdn.jsdelivr.net/npm/@dicebear/core@9/+esm';
    import * as avataaars from 'https://cdn.jsdelivr.net/npm/@dicebear/avataaars@9/+esm';

    const OPTIONS = {
      top: {
        label: 'Волосы',
        type: 'part',
        values: [
          'shortFlat', 'shortRound', 'shortWaved', 'shortCurly', 'shaggy',
          'shaggyMullet', 'bob', 'bun', 'curly', 'curvy',
          'longButNotTooLong', 'miaWallace', 'straight01', 'straight02', 'straightAndStrand'
        ]
      },
      hairColor: {
        label: 'Цвет волос',
        type: 'color',
        values: ['2c1b18', '4a312c', '724133', 'a55728', 'b58143', 'd6b370', 'c93305', 'f59797']
      },
      skinColor: {
        label: 'Кожа',
        type: 'color',
        values: ['ffdbb4', 'edb98a', 'd08b5b', '614335']
      },
      eyes: {
        label: 'Глаза',
        type: 'part',
        values: ['default', 'happy', 'wink', 'side', 'squint', 'hearts', 'closed']
      },
      eyebrows: {
        label: 'Брови',
        type: 'part',
        values: ['default', 'defaultNatural', 'raisedExcited', 'raisedExcitedNatural', 'flatNatural', 'sadConcerned', 'angryNatural', 'upDown']
      },
      mouth: {
        label: 'Рот',
        type: 'part',
        values: ['smile', 'default', 'twinkle', 'tongue', 'serious', 'concerned', 'disbelief', 'eating', 'grimace', 'sad']
      },
      clothing: {
        label: 'Одежда',
        type: 'part',
        values: ['hoodie', 'blazerAndShirt', 'blazerAndSweater', 'collarAndSweater', 'shirtCrewNeck', 'shirtScoopNeck', 'shirtVNeck']
      },
      clothesColor: {
        label: 'Цвет одежды',
        type: 'color',
        values: ['262e33', '3c4f5c', '5199e4', '65c9ff', '929598', 'a7ffc4', 'b1e2ff', 'e6e6e6', 'ff488e', 'ff5c5c', 'ffafb9', 'ffffb1']
      },
      accessories: {
        label: 'Очки',
        type: 'part',
        optional: true,
        values: ['round', 'prescription01', 'prescription02', 'sunglasses', 'wayfarers', 'kurt']
      },
      backgroundColor: {
        label: 'Фон',
        type: 'color',
        values: ['3b82f6', '8b5cf6', 'ec4899', '06b6d4', '10b981', 'f59e0b', 'b6e3f4', 'c0aede', 'ffd5dc', '2b2d42']
      }
    };

    const state = {
      top: 'shortFlat',
      hairColor: '2c1b18',
      skinColor: 'ffdbb4',
      eyes: 'default',
      eyebrows: 'defaultNatural',
      mouth: 'smile',
      clothing: 'hoodie',
      clothesColor: '5199e4',
      accessories: null,
      backgroundColor: '3b82f6'
    };

    let activeTab = 'top';

    function buildConfig(customState, withBg = false) {
      const cfg = {
        seed: 'base',
        top: [customState.top],
        hairColor: [customState.hairColor],
        skinColor: [customState.skinColor],
        eyes: [customState.eyes],
        eyebrows: [customState.eyebrows],
        mouth: [customState.mouth],
        clothing: [customState.clothing],
        clothesColor: [customState.clothesColor],
        facialHairProbability: 0,
        accessoriesProbability: customState.accessories ? 100 : 0
      };
      if (withBg) {
        cfg.backgroundColor = [customState.backgroundColor];
      }
      if (customState.accessories) {
        cfg.accessories = [customState.accessories];
      }
      return cfg;
    }

    function renderPreview() {
      document.getElementById('stage').style.backgroundColor = '#' + state.backgroundColor;
      document.getElementById('preview').innerHTML = createAvatar(avataaars, buildConfig(state, false)).toString();
    }

    function renderTabs() {
      const wrap = document.getElementById('tabs');
      wrap.innerHTML = '';
      Object.entries(OPTIONS).forEach(([key, cfg]) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (activeTab === key ? ' active' : '');
        btn.textContent = cfg.label;
        btn.onclick = () => {
          activeTab = key;
          renderTabs();
          renderGrid();
        };
        wrap.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      const cfg = OPTIONS[activeTab];
      document.getElementById('sectionTitle').textContent = cfg.label;
      grid.className = cfg.type === 'color' ? 'grid colors' : 'grid';
      grid.innerHTML = '';

      if (cfg.optional) {
        const none = document.createElement('div');
        none.className = 'item none' + (state[activeTab] === null ? ' active' : '');
        none.textContent = 'Нет';
        none.onclick = () => {
          state[activeTab] = null;
          renderPreview();
          renderGrid();
        };
        grid.appendChild(none);
      }

      cfg.values.forEach(val => {
        const card = document.createElement('div');
        card.className = 'item'
          + (cfg.type === 'color' ? ' color-card' : '')
          + (state[activeTab] === val ? ' active' : '');

        if (cfg.type === 'color') {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.style.background = '#' + val;
          card.appendChild(swatch);
        } else {
          const previewState = { ...state, [activeTab]: val };
          card.innerHTML = createAvatar(avataaars, buildConfig(previewState, true)).toString();
        }

        card.onclick = () => {
          state[activeTab] = val;
          renderPreview();
          renderGrid();
        };
        grid.appendChild(card);
      });
    }

    document.getElementById('randomBtn').onclick = () => {
      Object.entries(OPTIONS).forEach(([key, cfg]) => {
        const pool = cfg.optional ? [null, null, ...cfg.values] : cfg.values;
        state[key] = pool[Math.floor(Math.random() * pool.length)];
      });
      renderPreview();
      renderGrid();
    };

    document.getElementById('doneBtn').onclick = () => {
      localStorage.setItem('kpop_avatar_state', JSON.stringify(state));
      alert('Образ сохранён! (в основном приложении здесь закроется редактор)');
    };

    renderTabs();
    renderGrid();
    renderPreview();
  </script>
</body>
</html>
