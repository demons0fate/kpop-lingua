<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Avataaars Editor Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #12121a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .preview-wrap {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #1e1e2c;
      border: 3px solid #2e2e44;
      overflow: hidden;
      margin-bottom: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 440px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #6c5ce7;
      color: #fff;
    }
    .btn:active { transform: scale(0.97); }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      max-width: 440px;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 8px 14px;
      border-radius: 12px;
      background: #1e1e2c;
      color: #a0a0be;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid #2e2e44;
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      color: #12121a;
      border-color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 440px;
      padding-bottom: 24px;
    }
    .item {
      aspect-ratio: 1;
      background: #1e1e2c;
      border: 2px solid #2e2e44;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      cursor: pointer;
      overflow: hidden;
    }
    .item.active {
      border-color: #6c5ce7;
      background: #272540;
    }
    .item svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .item.none {
      font-size: 13px;
      color: #8888a8;
      font-weight: 600;
    }
    .swatch {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>

  <div class="preview-wrap" id="preview">Загрузка...</div>

  <div class="actions">
    <button class="btn" id="randomBtn">🎲 Случайный</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { createAvatar } from 'https://cdn.jsdelivr.net/npm/@dicebear/core@9/+esm';
    import * as avataaars from 'https://cdn.jsdelivr.net/npm/@dicebear/avataaars@9/+esm';

    const OPTIONS = {
      top: {
        label: 'Волосы',
        type: 'part',
        values: [
          'shortFlat', 'shortRound', 'shortWaved', 'shortCurly', 'shaggy',
          'shaggyMullet', 'theCaesar', 'frizzle', 'dreads01', 'sides',
          'bob', 'bun', 'curly', 'curvy', 'longButNotTooLong',
          'miaWallace', 'straight01', 'straight02', 'straightAndStrand', 'bigHair'
        ]
      },
      hairColor: {
        label: 'Цвет волос',
        type: 'color',
        values: ['2c1b18', '4a312c', '724133', 'a55728', 'b58143', 'd6b370', 'e8e1e1', 'c93305', 'f59797']
      },
      skinColor: {
        label: 'Кожа',
        type: 'color',
        values: ['ffdbb4', 'edb98a', 'd08b5b', 'ae5d29', '614335', 'f8d25c']
      },
      eyes: {
        label: 'Глаза',
        type: 'part',
        values: ['default', 'happy', 'wink', 'winkWacky', 'side', 'squint', 'surprised', 'hearts', 'closed', 'cry', 'eyeRoll']
      },
      eyebrows: {
        label: 'Брови',
        type: 'part',
        values: ['default', 'defaultNatural', 'raisedExcited', 'raisedExcitedNatural', 'flatNatural', 'sadConcerned', 'angryNatural', 'upDown']
      },
      mouth: {
        label: 'Рот',
        type: 'part',
        values: ['smile', 'default', 'twinkle', 'tongue', 'serious', 'concerned', 'disbelief', 'eating', 'grimace', 'sad']
      },
      clothing: {
        label: 'Одежда',
        type: 'part',
        values: ['hoodie', 'blazerAndShirt', 'blazerAndSweater', 'collarAndSweater', 'graphicShirt', 'shirtCrewNeck', 'shirtScoopNeck', 'shirtVNeck', 'overall']
      },
      clothesColor: {
        label: 'Цвет одежды',
        type: 'color',
        values: ['262e33', '3c4f5c', '5199e4', '65c9ff', '929598', 'a7ffc4', 'b1e2ff', 'e6e6e6', 'ff488e', 'ff5c5c', 'ffafb9', 'ffffb1']
      },
      accessories: {
        label: 'Очки',
        type: 'part',
        optional: true,
        values: ['round', 'prescription01', 'prescription02', 'sunglasses', 'wayfarers', 'kurt']
      },
      backgroundColor: {
        label: 'Фон',
        type: 'color',
        values: ['b6e3f4', 'c0aede', 'd1d4f9', 'ffd5dc', 'ffdfbf', 'c8f7dc', '2b2d42']
      }
    };

    const state = {
      top: 'shortFlat',
      hairColor: '2c1b18',
      skinColor: 'ffdbb4',
      eyes: 'default',
      eyebrows: 'defaultNatural',
      mouth: 'smile',
      clothing: 'hoodie',
      clothesColor: '5199e4',
      accessories: null,
      backgroundColor: 'b6e3f4'
    };

    let activeTab = 'top';

    function buildConfig(customState) {
      const cfg = {
        seed: 'base',
        top: [customState.top],
        hairColor: [customState.hairColor],
        skinColor: [customState.skinColor],
        eyes: [customState.eyes],
        eyebrows: [customState.eyebrows],
        mouth: [customState.mouth],
        clothing: [customState.clothing],
        clothesColor: [customState.clothesColor],
        backgroundColor: [customState.backgroundColor],
        facialHairProbability: 0,
        accessoriesProbability: customState.accessories ? 100 : 0
      };
      if (customState.accessories) {
        cfg.accessories = [customState.accessories];
      }
      return cfg;
    }

    function renderPreview() {
      const svg = createAvatar(avataaars, buildConfig(state)).toString();
      document.getElementById('preview').innerHTML = svg;
    }

    function renderTabs() {
      const wrap = document.getElementById('tabs');
      wrap.innerHTML = '';
      Object.entries(OPTIONS).forEach(([key, cfg]) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (activeTab === key ? ' active' : '');
        btn.textContent = cfg.label;
        btn.onclick = () => {
          activeTab = key;
          renderTabs();
          renderGrid();
        };
        wrap.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const cfg = OPTIONS[activeTab];

      if (cfg.optional) {
        const none = document.createElement('div');
        none.className = 'item none' + (state[activeTab] === null ? ' active' : '');
        none.textContent = 'Нет';
        none.onclick = () => {
          state[activeTab] = null;
          renderPreview();
          renderGrid();
        };
        grid.appendChild(none);
      }

      cfg.values.forEach(val => {
        const card = document.createElement('div');
        card.className = 'item' + (state[activeTab] === val ? ' active' : '');

        if (cfg.type === 'color') {
          const swatch = document.createElement('div');
          swatch.className = 'swatch';
          swatch.style.background = '#' + val;
          card.appendChild(swatch);
        } else {
          const previewState = { ...state, [activeTab]: val };
          card.innerHTML = createAvatar(avataaars, buildConfig(previewState)).toString();
        }

        card.onclick = () => {
          state[activeTab] = val;
          renderPreview();
          renderGrid();
        };
        grid.appendChild(card);
      });
    }

    document.getElementById('randomBtn').onclick = () => {
      Object.entries(OPTIONS).forEach(([key, cfg]) => {
        const pool = cfg.optional ? [null, null, ...cfg.values] : cfg.values;
        state[key] = pool[Math.floor(Math.random() * pool.length)];
      });
      renderPreview();
      renderGrid();
    };

    renderTabs();
    renderGrid();
    renderPreview();
  </script>
</body>
</html>
