<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-Pop Lingua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='25'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/telegram.js?v=1"></script>
<style>
:root {
  /* Палитра «Сеульский латте» */
  --bg: #FAF6F1;
  --surface: #FFFFFF;
  --surface-2: #F2EBE3;
  --border: #E6DCD2;
  --text: #3D312A;
  --muted: #8C7A6B;
  --accent: #D97742;
  --accent-soft: rgba(217, 119, 66, 0.12);
  --success: #52A368;
  --success-soft: rgba(82, 163, 104, 0.12);
  --danger: #D9534F;
  --danger-soft: rgba(217, 83, 79, 0.12);
  --gold: #D49A3A;
  --gold-soft: rgba(212, 154, 58, 0.14);
  --cyan: #D97742;
  --shadow: 0 4px 16px rgba(61, 49, 42, 0.05);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 92px; user-select: none; overflow-x: hidden; }
svg { display: block; flex-shrink: 0; }

#confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 120; }
.combo-flash { position: fixed; inset: 0; pointer-events: none; z-index: 110; background: radial-gradient(circle, rgba(217,119,66,0.22) 0%, transparent 70%); opacity: 0; transition: opacity 0.25s ease; }
.combo-flash.on { opacity: 1; }

/* ====== ШАПКА ====== */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; background: rgba(250, 246, 241, 0.94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; gap: 8px;
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 900; font-size: 15px; letter-spacing: -0.2px; color: var(--text); white-space: nowrap; }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.stats { display: flex; gap: 6px; align-items: center; }
.pill {
  background: var(--surface); border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 14px; font-weight: 800; font-size: 12px;
  display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
  color: var(--text); box-shadow: 0 2px 6px rgba(61,49,42,0.04);
  transition: transform 0.16s var(--spring);
}
.pill:active { transform: scale(0.94); }
.pill.streak { border-color: rgba(217,119,66,0.3); color: #B45309; }
.pill.coins { border-color: rgba(212,154,58,0.35); color: #9A6700; }
.pill.energy { border-color: rgba(82,163,104,0.3); color: #2E7D47; }
.pill.boost { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.screen { display: none; padding: 16px; animation: screenIn 0.24s ease; }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ====== КНОПКИ ====== */
.btn {
  background: var(--accent); color: #FFFFFF; border: none;
  padding: 12px 18px; border-radius: 14px; font-weight: 800; font-size: 14px;
  cursor: pointer; flex-shrink: 0; letter-spacing: 0.2px;
  box-shadow: 0 4px 12px rgba(217, 119, 66, 0.24);
  transition: transform 0.12s var(--spring), filter 0.15s;
}
.btn:active { transform: scale(0.97); filter: brightness(0.95); }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.btn.full { width: 100%; padding: 14px; font-size: 14px; }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); box-shadow: none; }
.btn.cyan { background: var(--text); color: #FFFFFF; box-shadow: 0 4px 12px rgba(61,49,42,0.18); }
.btn.gold { background: var(--gold); color: #FFFFFF; box-shadow: 0 4px 12px rgba(212,154,58,0.28); }

/* ====== ГЛАВНАЯ: ВЫБОР КУРСА + ТЕКУЩИЙ ТРЕК + ТРЕК-ЛИСТ ====== */
.course-picker {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 12px 14px; margin-bottom: 14px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform 0.15s;
}
.course-picker:active { transform: scale(0.985); }
.cp-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); }
.cp-title { font-size: 15px; font-weight: 900; color: var(--text); margin-top: 2px; }
.cp-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.cp-pct { font-size: 12px; font-weight: 800; color: var(--success); background: var(--success-soft); padding: 4px 8px; border-radius: 9px; }
.cp-arrow { font-size: 14px; color: var(--muted); }

.bar-bg { background: var(--surface-2); height: 7px; border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 8px; transition: width 0.4s ease; }

.hero-track {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 22px;
  padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.hero-track::before {
  content: ''; position: absolute; right: -28px; top: -28px; width: 110px; height: 110px;
  border-radius: 50%; background: var(--accent-soft); pointer-events: none;
}
.ht-badge {
  display: inline-block; font-size: 10px; font-weight: 900; letter-spacing: 0.8px;
  text-transform: uppercase; color: var(--accent); background: var(--accent-soft);
  padding: 4px 10px; border-radius: 8px; margin-bottom: 8px;
}
.ht-title { font-size: 19px; font-weight: 900; line-height: 1.25; margin: 0 0 6px; color: var(--text); }
.ht-desc { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0 0 12px; }
.ht-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.ht-chip { font-size: 11px; font-weight: 800; color: var(--text); background: var(--surface-2); padding: 5px 10px; border-radius: 9px; }

.tracklist-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--muted); margin: 0 2px 10px;
}
.track-row {
  display: flex; align-items: center; gap: 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px;
  margin-bottom: 9px; cursor: pointer; transition: transform 0.14s, border-color 0.2s;
}
.track-row:active { transform: scale(0.985); }
.track-row.active { border-color: var(--accent); background: #FFFBF7; box-shadow: 0 4px 14px rgba(217,119,66,0.1); }
.track-row.done { border-color: rgba(82,163,104,0.3); }
.track-row.locked { opacity: 0.52; cursor: default; }
.track-num {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900; background: var(--surface-2); color: var(--muted);
}
.track-row.active .track-num { background: var(--accent); color: #FFFFFF; }
.track-row.done .track-num { background: var(--success-soft); color: var(--success); font-size: 16px; }
.track-info { flex: 1; min-width: 0; }
.track-title { font-size: 14px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-right { font-size: 12px; font-weight: 800; color: var(--muted); flex-shrink: 0; }
.track-row.active .track-right { color: var(--accent); }

.chest-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--surface-2); border: 1.5px dashed var(--border); border-radius: 14px;
  padding: 10px 14px; margin-bottom: 9px; cursor: pointer; transition: transform 0.14s;
}
.chest-row:active { transform: scale(0.985); }
.chest-row.ready { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }
.chest-row.claimed { opacity: 0.65; border-style: solid; border-color: rgba(82,163,104,0.3); }

/* ====== УРОК (STUDY) ====== */
.study-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.close-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
.study-progress { flex: 1; }
.step-count { font-size: 12px; color: var(--muted); font-weight: 800; }
.combo-badge {
  display: none; font-size: 11px; font-weight: 900; color: #FFFFFF;
  background: var(--accent); padding: 4px 9px; border-radius: 10px;
  animation: popIn 0.25s var(--spring);
}
.combo-badge.show { display: inline-block; }
.retry-badge { display: inline-block; background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 10px; margin-bottom: 12px; }

.jump-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 10px; }
.jump-btn { min-width: 34px; height: 32px; padding: 0 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
.jump-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.card-box { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; line-height: 1.55; box-shadow: var(--shadow); }
.card-box h3 { margin: 0 0 10px; color: var(--text); font-size: 17px; font-weight: 900; }
.card-box p { margin: 0 0 10px; font-size: 14px; color: var(--text); }
.tip-box { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 10px; font-size: 13px; color: var(--text); margin: 12px 0; }

.example-list { display: grid; gap: 8px; margin-top: 12px; }
.example-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 11px 13px; border-radius: 14px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.14s; }
.example-row:active { transform: scale(0.985); }
.ex-kr { font-size: 24px; font-weight: 800; min-width: 74px; color: var(--text); }
.ex-info { flex: 1; padding: 0 10px; }
.ex-tr { font-size: 13px; color: var(--accent); font-weight: 800; }
.ex-ru { font-size: 12px; color: var(--muted); }
.ex-play { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; }

.prompt-word { text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.big-kr { font-size: 44px; font-weight: 900; letter-spacing: 2px; color: var(--text); }
.big-tr { font-size: 14px; color: var(--accent); margin-top: 6px; font-weight: 700; }
.audio-pill { margin-top: 12px; background: var(--accent); color: #FFFFFF; border: none; padding: 10px 20px; border-radius: 24px; font-weight: 800; font-size: 13px; cursor: pointer; }
.listen-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 4px; }
.big-listen-btn { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); border: none; color: #FFFFFF; font-size: 28px; cursor: pointer; box-shadow: 0 8px 20px rgba(217,119,66,0.3); display: flex; align-items: center; justify-content: center; }
.slow-listen-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text); font-size: 13px; font-weight: 800; cursor: pointer; }
.big-listen-btn:active, .slow-listen-btn:active { transform: scale(0.92); }

.opt-btn { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 14px; margin-bottom: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.14s, border-color 0.2s; }
.opt-btn:active { transform: scale(0.985); }
.opt-btn.correct { background: var(--success-soft); border-color: var(--success); color: #256638; }
.opt-btn.wrong { background: var(--danger-soft); border-color: var(--danger); color: #A63330; }

.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-btn { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); padding: 14px 10px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 54px; transition: 0.15s; }
.match-btn.kr { font-size: 20px; font-weight: 800; }
.match-btn.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.match-btn.matched { opacity: 0.28; border-color: var(--success); background: var(--success-soft); pointer-events: none; }
.match-btn.wrong { border-color: var(--danger); background: var(--danger-soft); }

.build-slots { min-height: 64px; background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 16px; }
.build-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
.chip { background: var(--surface); border: 1.5px solid var(--border); color: var(--text); padding: 11px 17px; border-radius: 14px; font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(61,49,42,0.05); transition: transform 0.12s; }
.chip:active { transform: scale(0.92); }
.chip.used { opacity: 0.25; pointer-events: none; }
.chip.in-slot { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.chip-space { min-width: 56px; color: var(--muted); font-size: 15px; }

/* ====== ПРОПИСИ (КРЕМОВЫЙ БЛОКНОТ В КЛЕТКУ) ====== */
.draw-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.draw-meta-title { font-size: 16px; font-weight: 900; color: var(--text); }
.draw-hint { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.draw-stage {
  position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 245px; margin: 0 auto 14px;
  border-radius: 18px; background-color: #FFFDF9;
  background-image:
    linear-gradient(to right, #EFE6DC 1px, transparent 1px),
    linear-gradient(to bottom, #EFE6DC 1px, transparent 1px);
  background-size: 24px 24px;
  border: 2px solid var(--border); box-shadow: inset 0 2px 10px rgba(61,49,42,0.04);
  overflow: hidden; touch-action: none;
}
.draw-stage canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
.draw-controls { display: flex; gap: 8px; margin-bottom: 12px; }
.draw-controls .btn { flex: 1; padding: 11px 10px; font-size: 13px; }

.feedback-bar { padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; font-size: 13px; font-weight: 700; display: none; line-height: 1.4; }
.feedback-bar.ok { display: block; background: var(--success-soft); border: 1px solid var(--success); color: #256638; }
.feedback-bar.err { display: block; background: var(--danger-soft); border: 1px solid var(--danger); color: #A63330; }

.finish-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 16px; }
.finish-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 6px; text-align: center; }
.finish-stat b { display: block; font-size: 16px; color: var(--text); }
.finish-stat span { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; }

/* ====== СЛОВАРЬ И 3D-КАРТОЧКИ ====== */
.mode-switch { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; border: 1px solid var(--border); }
.mode-btn { flex: 1; border: none; background: transparent; color: var(--muted); padding: 9px 6px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
.mode-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 6px rgba(61,49,42,0.08); }

.vocab-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.vocab-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer; transition: transform 0.14s; }
.vocab-row:active { transform: scale(0.985); }
.vocab-tag { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; flex-shrink: 0; }

.fc-scene { perspective: 1100px; margin: 14px 0 18px; height: 280px; }
.fc-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.55s var(--spring); cursor: pointer; }
.fc-inner.flipped { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: var(--shadow); }
.fc-front { background: var(--surface); border: 1.5px solid var(--border); }
.fc-back { background: #FFFBF7; border: 1.5px solid var(--accent); transform: rotateY(180deg); }
.fc-badge { position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 10px; }
.fc-kr { font-size: 46px; font-weight: 900; letter-spacing: 2px; color: var(--text); }
.fc-tr { font-size: 17px; color: var(--accent); font-weight: 800; margin-top: 8px; }
.fc-ru { font-size: 22px; font-weight: 900; color: var(--text); margin-top: 8px; }
.fc-hint { position: absolute; bottom: 16px; font-size: 11px; color: var(--muted); }
.fc-nav { display: flex; gap: 10px; }
.fc-nav .btn { flex: 1; }

/* ====== МОДАЛКИ ====== */
.modal-bg { position: fixed; inset: 0; background: rgba(61, 49, 42, 0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 80; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 18px; }
.modal-bg.open { display: flex; animation: fadeIn 0.2s ease; }
.modal-bg.sheet { justify-content: flex-end; padding: 0; }
.sheet-box { width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 18px 16px 28px; box-shadow: 0 -10px 32px rgba(61,49,42,0.16); animation: sheetUp 0.24s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

/* ====== НИЖНЯЯ ПАНЕЛЬ (5 ИКОНОК БЕЗ ТЕКСТА) ====== */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 10px 14px; border-top: 1px solid var(--border); z-index: 30;
}
.nav-item {
  color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  width: 52px; height: 42px; border-radius: 14px; position: relative;
  transition: color 0.18s, background 0.18s, transform 0.14s var(--spring);
}
.nav-item:active { transform: scale(0.9); }
.nav-item.active { color: var(--accent); background: var(--accent-soft); }
.nav-badge {
  position: absolute; top: 4px; right: 7px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 99px; background: var(--accent); color: #FFFFFF;
  font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  border: 2px solid #FFFFFF;
}
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="combo-flash" id="combo-flash"></div>

<div class="header">
  <div class="brand"><span class="brand-dot"></span>K-Pop Lingua</div>
  <div class="stats">
    <div class="pill boost" id="boost-pill" onclick="openShopSheet()" style="display:none">⚡ ×2</div>
    <div class="pill streak" onclick="showStreakInfo()">🔥 <span id="streak-val">1</span></div>
    <div class="pill coins" onclick="openShopSheet()">🎵 <span id="coins-val">50</span></div>
    <div class="pill energy" onclick="openShopSheet()">⚡ <span id="energy-val">5/5</span></div>
  </div>
</div>

<!-- 1. УРОКИ (ТРЕК-ЛИСТ) -->
<div id="screen-lessons" class="screen active">
  <div class="course-picker" id="module-banner" onclick="openModulePicker()" role="button" tabindex="0">
    <div style="min-width:0">
      <div class="cp-tag" id="module-tag">Блок 1 • Хангыль</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;

window.LESSONS = window.LESSONS || [];

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
window.escapeHtml = escapeHtml;

function closePackModal() {
  const m = document.getElementById('pack-modal');
  if (m) { m.classList.remove('open', 'sheet'); }
}
window.closePackModal = closePackModal;

/* ====== ВИБРООТКЛИК + ЗВУКИ + КОНФЕТТИ ====== */
function haptic(type = 'light') {
  if (window.KPLTelegram) return window.KPLTelegram.haptic(type);
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (type === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'err') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred(type);
  } catch (e) {}
}

let audioCtx = null;
function sfx(type) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) {
      try { if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; } catch (e) {}
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const playTone = (freq, start, dur, wave = 'sine', vol = 0.07) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = wave; o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(vol, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start + dur);
    };
    if (type === 'ok') { playTone(523.25, t, 0.12); playTone(783.99, t + 0.08, 0.18); }
    else if (type === 'err') { playTone(220, t, 0.15, 'triangle', 0.09); playTone(165, t + 0.09, 0.2, 'triangle', 0.09); }
    else if (type === 'win') { [523, 659, 784, 1046].forEach((f, i) => playTone(f, t + i * 0.08, 0.22)); }
    else if (type === 'tap') { playTone(440, t, 0.05, 'sine', 0.035); }
  } catch (e) {}
}

function fireConfetti() {
  const c = document.getElementById('confetti-canvas');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const colors = ['#D97742', '#D49A3A', '#52A368', '#E07A5F', '#3D312A'];
  const parts = Array.from({ length: 60 }, () => ({
    x: c.width / 2, y: c.height * 0.42,
    vx: (Math.random() - 0.5) * 13, vy: (Math.random() - 0.85) * 13,
    s: Math.random() * 6 + 4, col: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360, vr: (Math.random() - 0.5) * 12, life: 1
  }));
  const tick = () => {
    ctx.clearRect(0, 0, c.width, c.height);
    let alive = false;
    parts.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.vr; p.life -= 0.018;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, c.width, c.height);
  };
  tick();
}

const MAX_ENERGY = 5;
const BASE_ENERGY_MS = 2 * 60 * 60 * 1000;

let st = {
  coins: 50, xp: 0, done: [], drawn: [],
  energy: MAX_ENERGY, lastEnergyTs: Date.now()
};
try {
  const s = localStorage.getItem('kp_lingua_v4');
  if (s) {
    st = { ...st, ...JSON.parse(s) };
    if (!Array.isArray(st.done)) st.done = [];
    if (!Array.isArray(st.drawn)) st.drawn = [];
    if (typeof st.energy !== 'number') { st.energy = MAX_ENERGY; st.lastEnergyTs = Date.now(); }
  }
} catch (e) {}

function getEnergyRegenMs() { return BASE_ENERGY_MS; }

function syncResources() {
  const now = Date.now(), eMs = getEnergyRegenMs();
  let changed = false;
  if (st.energy < MAX_ENERGY) {
    const g = Math.floor((now - st.lastEnergyTs) / eMs);
    if (g > 0) {
      st.energy = Math.min(MAX_ENERGY, st.energy + g);
      st.lastEnergyTs = st.energy >= MAX_ENERGY ? now : st.lastEnergyTs + g * eMs;
      changed = true;
    }
  }
  if (changed) save(false);
  const elE = document.getElementById('energy-val');
  const elS = document.getElementById('streak-val');
  const elC = document.getElementById('coins-val');
  if (elE) elE.innerText = `${st.energy}/${MAX_ENERGY}`;
  if (elS) elS.innerText = (st.streak && st.streak.count) || 1;
  if (elC) elC.innerText = st.coins;
  const boostPill = document.getElementById('boost-pill');
  if (boostPill) boostPill.style.display = (st.xpBoostUntil && Date.now() < st.xpBoostUntil) ? 'flex' : 'none';
}

function fmtWait(ms) {
  const m = Math.max(1, Math.ceil(ms / 60000));
  const h = Math.floor(m / 60), rm = m % 60;
  return h > 0 ? `${h}ч ${rm}м` : `${rm} мин`;
}

function save(doSync = true) {
  try { localStorage.setItem('kp_lingua_v4', JSON.stringify(st)); } catch (e) {}
  if (doSync) syncResources();
}

function buyEnergy(amount, price) {
  syncResources();
  if (st.energy >= MAX_ENERGY) return alert('Лайтстики уже полные!');
  if (st.coins < price) return alert(`Нужно ${price} 🎵.`);
  st.coins -= price; st.energy = Math.min(MAX_ENERGY, st.energy + amount);
  if (st.energy >= MAX_ENERGY) st.lastEnergyTs = Date.now();
  haptic('ok'); sfx('ok'); save();
  if (typeof window.openShopSheet === 'function') window.openShopSheet();
}

let curAudio = null;
function playAudio(file, text, rate = 1.0) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  const fallback = () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = rate * 0.85;
      window.speechSynthesis.speak(u);
    }
  };
  if (!file) return fallback();
  const a = new Audio(file); a.playbackRate = rate; curAudio = a;
  a.onerror = fallback; a.play().catch(fallback);
}

function switchTab(t) {

let vocabMode = 'list', vocabDeck = [], fcIdx = 0, fcFlipped = false;
let dictDeck = [], dictIdx = 0;

function getUnlockedVocab() { return VOCAB.filter(w => st.done.includes(w.l)); }
function setVocabMode(m) {
  haptic('light'); vocabMode = m;
  document.getElementById('vmode-list').classList.toggle('active', m === 'list');
  document.getElementById('vmode-cards').classList.toggle('active', m === 'cards');
  document.getElementById('vmode-dict').classList.toggle('active', m === 'dict');

  dictIdx = 0; dictDeck = shuffle(getUnlockedVocab());

}

function renderVocab() {
  const unlocked = getUnlockedVocab();
  document.getElementById('vocab-count').innerText = `${unlocked.length} / ${VOCAB.length}`;
  const body = document.getElementById('vocab-body'); body.innerHTML = '';

  if (!unlocked.length) {
    body.innerHTML = `<div class="card-box" style="text-align:center;padding:28px 18px"><h3>Словарь пока пуст</h3><p style="color:var(--muted)">Пройди <b>Урок 1</b>, и все изученные слова автоматически появятся здесь для повторения и диктанта!</p><button class="btn" style="margin-top:8px" onclick="switchTab('lessons')">К урокам</button></div>`;
    return;
  }

  if (vocabMode === 'list') {
    unlocked.forEach(w => {
      const row = document.createElement('div'); row.className = 'vocab-row';
      row.innerHTML = `
        <div class="vocab-tag">${w.kr[0]}</div>

          <div style="font-size:13px;color:var(--muted)">${w.ru}</div>
        </div>
        <div class="ex-play">🔊</div>`;
      row.onclick = () => { haptic('light'); playAudio(w.file, w.kr); };
      body.appendChild(row);
    });
  } else if (vocabMode === 'cards') {
    if (!vocabDeck.length || vocabDeck.length !== unlocked.length) vocabDeck = [...unlocked];
    if (fcIdx >= vocabDeck.length) fcIdx = 0;
    const w = vocabDeck[fcIdx];

    body.innerHTML = `
      <div style="text-align:center;font-size:12px;color:var(--muted);font-weight:700">Карточка ${fcIdx + 1} из ${vocabDeck.length}</div>
      <div class="fc-scene">
        <div class="fc-inner ${fcFlipped ? 'flipped' : ''}" id="fc-card">
          <div class="fc-face fc-front">
            <div class="fc-badge">Урок ${w.l}</div>
            <div class="fc-kr">${w.kr}</div>
            <button class="audio-pill" id="fc-audio">🔊 Послушать</button>
            <div class="fc-hint">Нажми на карточку, чтобы перевернуть</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-badge">Перевод</div>
            <div class="fc-kr" style="font-size:36px">${w.kr}</div>
            <div class="fc-tr">${w.tr}</div>
            <div class="fc-ru">${w.ru}</div>
            <div class="fc-hint">Нажми ещё раз, чтобы вернуть</div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="btn ghost" id="fc-prev">← Назад</button>
        <button class="btn ghost" id="fc-shuf">Перемешать</button>
        <button class="btn" id="fc-next">Дальше →</button>
      </div>`;

    document.getElementById('fc-card').onclick = (e) => {
      if (e.target.id === 'fc-audio') return;
      haptic('light'); sfx('tap');
      fcFlipped = !fcFlipped;
      document.getElementById('fc-card').classList.toggle('flipped', fcFlipped);
      if (fcFlipped && window.trackQuest) window.trackQuest('card', w.kr);
    };
    document.getElementById('fc-audio').onclick = (e) => { e.stopPropagation(); haptic('light'); playAudio(w.file, w.kr); };
    document.getElementById('fc-prev').onclick = () => { haptic('light'); fcIdx = (fcIdx - 1 + vocabDeck.length) % vocabDeck.length; fcFlipped = false; renderVocab(); };
    document.getElementById('fc-next').onclick = () => { haptic('light'); fcIdx = (fcIdx + 1) % vocabDeck.length; fcFlipped = false; renderVocab(); };
    document.getElementById('fc-shuf').onclick = () => { haptic('light'); vocabDeck = shuffle(unlocked); fcIdx = 0; fcFlipped = false; renderVocab(); };
  } else {
    if (!dictDeck.length || dictDeck.length !== unlocked.length) dictDeck = shuffle(unlocked);
    if (dictIdx >= dictDeck.length) { dictDeck = shuffle(unlocked); dictIdx = 0; }
    const w = dictDeck[dictIdx];

    const topInfo = document.createElement('div');

      if (!st.drawn.includes(w.kr)) {

      }
      if (window.trackQuest) window.trackQuest('dict', w.kr);
      nextBtn.style.display = 'block';
    });
  }
}

/* ====== РАСПОЗНАВАНИЕ ПОЧЕРКА (СТРОГОЕ) ====== */
async function recognizeKoreanStrokes(strokes, w, h) {
  const res = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ options: 'enable_pre_space', requests: [{ writing_guide: { writing_area_width: w, writing_area_height: h }, ink: strokes, language: 'ko' }] })
  });
  const data = await res.json();
  if (data[0] === 'SUCCESS' && data[1] && data[1][0] && Array.isArray(data[1][0][1])) return data[1][0][1];
  throw new Error('IME empty');
}

function fallbackSectorCheck(inkC, targetText, FONT, W, H) {
  const getBox = (ctx) => {
    const d = ctx.getImageData(0, 0, W, H).data;
    let minX = W, minY = H, maxX = -1, maxY = -1, c = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 35) { c++; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    return { minX, minY, w: maxX - minX + 1, h: maxY - minY + 1, c };
  };
  const norm = (src, b, N = 64) => {
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const ctx = c.getContext('2d'); const sc = Math.min((N - 12) / b.w, (N - 12) / b.h);
    ctx.drawImage(src, b.minX, b.minY, b.w, b.h, (N - b.w * sc) / 2, (N - b.h * sc) / 2, b.w * sc, b.h * sc);
    const d = ctx.getImageData(0, 0, N, N).data; const bin = new Uint8Array(N * N);
    for (let i = 0; i < N * N; i++) if (d[i * 4 + 3] > 30) bin[i] = 1;
    return bin;
  };
  const dil = (bin, N, r) => {
    const o = new Uint8Array(N * N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (bin[y * N + x])
      for (let yy = Math.max(0, y - r); yy <= Math.min(N - 1, y + r); yy++)
        for (let xx = Math.max(0, x - r); xx <= Math.min(N - 1, x + r); xx++) o[yy * N + xx] = 1;
    return o;
  };
  const uBox = getBox(inkC.getContext('2d'));
  if (uBox.c < 20) return false;
  const tC = document.createElement('canvas'); tC.width = W; tC.height = H;
  const tCtx = tC.getContext('2d'); tCtx.font = FONT; tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle'; tCtx.fillStyle = '#3D312A';
  tCtx.fillText(targetText, W / 2, H / 2 + 6);
  const tBox = getBox(tCtx);
  const N = 64, uB = norm(inkC, uBox, N), tB = norm(tC, tBox, N);
  const uD = dil(uB, N, 2), tD = dil(tB, N, 2);
  for (let sy = 0; sy < 4; sy++) for (let sx = 0; sx < 4; sx++) {
    let tt = 0, th = 0;
    for (let y = sy * 16; y < (sy + 1) * 16; y++) for (let x = sx * 16; x < (sx + 1) * 16; x++) if (tB[y * N + x]) { tt++; if (uD[y * N + x]) th++; }
    if (tt > 8 && th / tt < 0.45) return false;
  }
  let ut = 0, uh = 0;
  for (let i = 0; i < N * N; i++) if (uB[i]) { ut++; if (tD[i]) uh++; }
  return ut > 0 && (uh / ut) >= 0.72;
}

function mountDrawWidget(container, item, blindMode, onSuccess, onFail, noPeek = false) {
  const W = 400, H = 300;
  const len = item.kr.length;
  const fontSize = len === 1 ? 155 : (len === 2 ? 115 : 88);

  let drawing = false, lastX = 0, lastY = 0, strokes = [], curStroke = null, startTime = 0;
  iCtx.strokeStyle = '#3D312A'; iCtx.lineWidth = 7; iCtx.lineCap = 'round'; iCtx.lineJoin = 'round';
  const getPos = (e) => { const r = inkC.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };

  inkC.addEventListener('pointerdown', (e) => {
    e.preventDefault(); inkC.setPointerCapture(e.pointerId); drawing = true; const p = getPos(e);
    if (!strokes.length) startTime = Date.now();

    lastX = p.x; lastY = p.y; iCtx.beginPath(); iCtx.moveTo(p.x, p.y); iCtx.lineTo(p.x + 0.1, p.y + 0.1); iCtx.stroke();
  });

function getModuleLessons(moduleId) {
  return (Array.isArray(LESSONS) ? LESSONS : []).filter(l => l.moduleId === moduleId);
}
function getExamPeers(lesson) {
  const moduleId = lesson && lesson.moduleId;
  const scoped = moduleId ? getModuleLessons(moduleId).filter(l => !l.isExam) : [];
  return scoped.length ? scoped : LESSONS.filter(l => !l.isExam);
}
const selectedModuleId = { value: null };
function getCurrentModule() {
  if (!Array.isArray(MODULES) || !MODULES.length) return null;
  if (selectedModuleId.value) {
    const picked = MODULES.find(m => m.id === selectedModuleId.value);
    if (picked) return picked;
  }
  return MODULES.find(m => (m.lessonIds || []).some(id => !st.done.includes(id))) || MODULES[MODULES.length - 1];
}
function getModulePathLessons(module) {
  const all = Array.isArray(LESSONS) ? LESSONS : [];
  if (!module) return all;
  const ids = Array.isArray(module.lessonIds) ? module.lessonIds : [];
  let list = all.filter(l => ids.length ? ids.includes(l.id) : l.moduleId === module.id);
  if (!list.length) list = all.filter(l => l.moduleId === module.id);
  return list.length ? list : all;
}
function lessonNoteReward(l) {
  const base = Math.max(10, Math.round((Number(l && l.coins) || 80) * 0.15));
  return (l && l.isExam) ? Math.max(40, base) : base;
}
function isLessonUnlocked(l, idx) {
  if (st.done.includes(l.id)) return true;
  if (l.isExam) return getExamPeers(l).every(x => st.done.includes(x.id));
  return idx === 0 || st.done.includes(LESSONS[idx - 1].id);
}

let curL = null, isReplay = false, queue = [], qIdx = 0, mistakes = 0, stepFailed = false, buildAns = [];

function updateCombo(isOk) {

  if (isOk) {
    curCombo++;

async function startLesson(id) {
  if (lessonLoading) return;
  syncResources();
  const meta = (Array.isArray(LESSONS) ? LESSONS : []).find(x => x.id === id);
  if (!meta) return alert('Урок не найден. Обнови страницу.');
  const replay = st.done.includes(meta.id);

  if (!replay && st.energy <= 0) {
    if (typeof window.openShopSheet === 'function') window.openShopSheet('Закончились лайтстики ⚡!');
    else alert('Закончились лайтстики ⚡!');
    return;
  }

  lessonLoading = true;
  let lesson = meta;
  try {
    if (!Array.isArray(meta.steps) || !meta.steps.length) {
      if (!window.AppData) throw new Error('data loader is missing');
      lesson = await window.AppData.lesson(meta.id);
    }
  } catch (e) {
    lessonLoading = false;
    return alert('Не удалось загрузить урок. Проверь соединение.');
  }

  if (!Array.isArray(lesson.steps) || !lesson.steps.length) {
    lessonLoading = false;
    return alert('В этом уроке нет заданий.');
  }

  if (!replay) {
    if (st.energy <= 0) { lessonLoading = false; return; }
    if (st.energy === MAX_ENERGY) st.lastEnergyTs = Date.now();
    st.energy--; save();
  }

  curL = lesson; isReplay = replay;
  queue = lesson.steps.map(s => ({ ...s, isRetry: false }));
  qIdx = 0; mistakes = 0; curCombo = 0; lessonStartTs = Date.now();
  const badge = document.getElementById('combo-badge');
  if (badge) badge.classList.remove('show');
  lessonLoading = false;
  switchTab('study');
  renderStep();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

        else { haptic('err'); sfx('err'); updateCombo(false); b.classList.add('wrong'); optsWrap.children[s.correct].classList.add('correct'); fb.className = 'feedback-bar err'; fb.innerText = (isExam ? 'Ошибка. ' : 'Ошибка (вернёмся в конце). ') + s.explain; mistakes++; if (!isExam) queue.push({ ...s, isRetry: true }); }
        nextBtn.style.display = 'block';
      };
      optsWrap.appendChild(b);
    });
    body.append(optsWrap, fb, nextBtn);
  }

  if (s.type === 'match') {
    const h = document.createElement('h3'); h.style.cssText = 'margin:0 0 14px;font-size:16px'; h.innerText = s.q || 'Соедини пары'; body.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'match-grid';
    const colL = document.createElement('div'); colL.className = 'match-col';
    const colR = document.createElement('div'); colR.className = 'match-col';
    const fb = document.createElement('div'); fb.className = 'feedback-bar';
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;

    let selL = null, selR = null, matched = 0;
    const tryMatch = () => {
      if (!selL || !selR) return;
      if (selL.id === selR.id) {
        haptic('ok'); sfx('ok');
        selL.el.classList.remove('sel'); selR.el.classList.remove('sel');
        selL.el.classList.add('matched'); selR.el.classList.add('matched');
        playAudio(selL.file, selL.kr); matched++; selL = null; selR = null;
        if (matched === s.pairs.length) { fb.className = 'feedback-bar ok'; fb.innerText = 'Все пары собраны!'; nextBtn.style.display = 'block'; }
      } else {
        haptic('err'); sfx('err');
        const a = selL.el, b = selR.el; a.classList.add('wrong'); b.classList.add('wrong');
        mistakes++; selL = null; selR = null;
        setTimeout(() => { a.classList.remove('sel', 'wrong'); b.classList.remove('sel', 'wrong'); }, 450);
      }
    };

    shuffle(s.pairs.map((p, i) => ({ ...p, id: i }))).forEach(item => {
      const b = document.createElement('button'); b.className = 'match-btn kr'; b.innerText = item.kr;
      b.onclick = () => { haptic('light'); colL.querySelectorAll('.match-btn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); playAudio(item.file, item.kr); selL = { ...item, el: b }; tryMatch(); };
      colL.appendChild(b);
    });
    shuffle(s.pairs.map((p, i) => ({ ...p, id: i }))).forEach(item => {
      const b = document.createElement('button'); b.className = 'match-btn'; b.innerText = item.ru;
      b.onclick = () => { haptic('light'); colR.querySelectorAll('.match-btn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); selR = { ...item, el: b }; tryMatch(); };
      colR.appendChild(b);
    });
    grid.append(colL, colR); body.append(grid, fb, nextBtn);
  }

  if (s.type === 'build' || s.type === 'listen_build') {
    buildAns = []; const isListen = s.type === 'listen_build';
    const prompt = document.createElement('div'); prompt.className = 'prompt-word'; prompt.style.padding = '16px';
    if (isListen) {
      prompt.innerHTML = `<div style="font-size:15px;font-weight:800;margin-bottom:4px">${s.q || 'Послушай и собери фразу'}</div>`;
      const row = document.createElement('div'); row.className = 'listen-row';
      const lb = document.createElement('button'); lb.className = 'big-listen-btn'; lb.innerText = '🔊'; lb.onclick = () => playAudio(s.file, s.audioText, 1.0);
      const sb = document.createElement('button'); sb.className = 'slow-listen-btn'; sb.innerText = '0.7x'; sb.onclick = () => playAudio(s.file, s.audioText, 0.72);
      row.append(lb, sb); prompt.appendChild(row);
      setTimeout(() => playAudio(s.file, s.audioText, 1.0), 250);
    } else {
      prompt.innerHTML = `<div style="font-size:16px;font-weight:800">${s.q}</div>`;
      if (!isExam) { const ab = document.createElement('button'); ab.className = 'audio-pill'; ab.innerText = '🔊 Подсказка'; ab.onclick = () => playAudio(s.file, s.audioText, 1.0); prompt.appendChild(ab); }
    }

    const slots = document.createElement('div'); slots.className = 'build-slots';
    const pool = document.createElement('div'); pool.className = 'build-pool';
    const fb = document.createElement('div'); fb.className = 'feedback-bar';
    const checkBtn = document.createElement('button'); checkBtn.className = 'btn full'; checkBtn.innerText = 'Проверить';
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;

    const chipLabel = (val) => (val === ' ' ? '␣' : val);
    const renderBuild = () => {
      slots.innerHTML = buildAns.length ? '' : '<span style="color:var(--muted);font-size:13px">Нажимай на блоки ниже</span>';
      buildAns.forEach((item, pos) => {
        const c = document.createElement('button');
        c.className = 'chip in-slot' + (item.val === ' ' ? ' chip-space' : '');
        c.innerText = chipLabel(item.val);
        c.onclick = () => { haptic('light'); sfx('tap'); buildAns.splice(pos, 1); renderBuild(); };
        slots.appendChild(c);
      });
      pool.innerHTML = '';
      s.pool.forEach((val, idx) => {
        const c = document.createElement('button');
        c.className = 'chip' + (val === ' ' ? ' chip-space' : '') + (buildAns.some(a => a.idx === idx) ? ' used' : '');
        c.innerText = chipLabel(val);
        c.onclick = () => { haptic('light'); sfx('tap'); buildAns.push({ val, idx }); renderBuild(); };
        pool.appendChild(c);
      });
    };

    checkBtn.onclick = () => {
      if (normalizeAnswer(buildAns.map(a => a.val)) === normalizeAnswer(s.answer)) {
        haptic('ok'); sfx('ok'); updateCombo(true); fb.className = 'feedback-bar ok'; fb.innerText = s.explain;
        checkBtn.style.display = 'none'; nextBtn.style.display = 'block'; playAudio(s.file, s.audioText, 1.0);
      } else {
        haptic('err'); sfx('err'); updateCombo(false); fb.className = 'feedback-bar err'; fb.innerText = 'Не совсем так! Попробуй переставить блоки.';
        if (!stepFailed) { stepFailed = true; mistakes++; if (!isExam) queue.push({ ...s, isRetry: true }); }
      }
    };
    renderBuild(); body.append(prompt, slots, pool, fb, checkBtn, nextBtn);
  }
}

function nextStep() { haptic('light'); qIdx++; renderStep(); }

const WEEKLY_XP_TRAINING = 5;
function addWeeklyXp(amount) {
  const n = Math.max(0, Math.round(Number(amount) || 0));
  if (!n) return 0;
  if (typeof st.weeklyXp !== 'number' || !isFinite(st.weeklyXp)) st.weeklyXp = 0;
  st.weeklyXp += n;
  return n;
}
window.addWeeklyXp = addWeeklyXp;
window.addWeeklyHype = addWeeklyXp;

function awardDictationStep() {
  st.xp += WEEKLY_XP_TRAINING;
  const amount = addWeeklyXp(WEEKLY_XP_TRAINING);
  if (typeof window.trackQuest === 'function') window.trackQuest('dict');
  save();
  return amount;
}
window.awardDictationStep = awardDictationStep;

function calcLessonRewards(lesson, replay) {
  const baseCoins = Number(lesson.coins) || 0;
  const baseXp = Number(lesson.xp) || 0;
  const boostOn = !!(st.xpBoostUntil && Date.now() < st.xpBoostUntil);
  if (replay) return { coins: 2, xp: 5, xpBoost: false, perfect: false };

  const baseNotes = Math.max(10, Math.round((baseCoins || 80) * 0.15));
  const coins = lesson.isExam ? Math.max(40, baseNotes) : baseNotes;
  const perfect = mistakes === 0;
  let xp = perfect ? Math.round(baseXp * 1.25) : baseXp;
  if (boostOn) xp *= 2;
  return { coins, xp, xpBoost: boostOn, perfect };
}

function finishLesson() {
  document.getElementById('study-bar').style.width = '100%';
  if (curL.isExam && mistakes > 4) {
    haptic('err'); sfx('err');
    document.getElementById('study-body').innerHTML = `
      <div class="card-box" style="text-align:center;padding:26px 18px">
        <h2 style="margin:0 0 8px;color:var(--danger)">Экзамен не сдан</h2>
        <p>Допущено ошибок: <b>${mistakes}</b> (нужно не больше 4).</p>
        <p style="color:var(--muted)">Пересдача бесплатная — повтори слова и попробуй снова.</p>
      </div>
      <button class="btn gold full" style="margin-bottom:10px" onclick="startLesson(${curL.id})">Пересдать экзамен</button>
      <button class="btn ghost full" onclick="switchTab('vocab')">Повторить слова в Словаре</button>`;
    return;
  }

  haptic('ok'); sfx('win'); fireConfetti();
  const wasFirst = !st.done.includes(curL.id);
  const rewards = calcLessonRewards(curL, !wasFirst);
  const elapsedSec = Math.max(5, Math.round((Date.now() - (lessonStartTs || Date.now())) / 1000));
  const timeStr = `${Math.floor(elapsedSec / 60)}:${String(elapsedSec % 60).padStart(2, '0')}`;
  const acc = Math.max(0, Math.round((1 - mistakes / Math.max(1, curL.steps.length)) * 100));

  let vocabHtml = '';
  if (wasFirst) {
    st.done.push(curL.id);
    const newWords = (Array.isArray(VOCAB) ? VOCAB : []).filter(w => w.l === curL.id).length;
    if (newWords > 0) vocabHtml = `<p style="color:var(--success);font-weight:800;margin-top:8px">В словарь добавлено новых слов: +${newWords}</p>`;
  }
  st.coins += rewards.coins;
  st.xp += rewards.xp;
  addWeeklyXp(rewards.xp);
  save();

  document.getElementById('study-body').innerHTML = `
    <div class="card-box" style="text-align:center;padding:24px 18px">
      <div style="font-size:38px;margin-bottom:6px">${curL.isExam ? '🏆' : '🎉'}</div>
      <h2 style="margin:0 0 4px;font-size:21px">${curL.isExam ? 'Экзамен сдан!' : 'Урок пройден!'}</h2>
      <div style="font-size:13px;color:var(--accent);font-weight:800">Награда: +${rewards.coins} 🎵${rewards.xpBoost ? ' • ⚡ ×2 XP' : ''}</div>
      <div class="finish-grid">
        <div class="finish-stat"><b>+${rewards.xp}</b><span>⚡ XP</span></div>
        <div class="finish-stat"><b>${acc}%</b><span>🎯 Точность</span></div>
        <div class="finish-stat"><b>${timeStr}</b><span>⏱️ Время</span></div>
      </div>
      ${vocabHtml}
    </div>
    <button class="btn full" style="margin-bottom:10px" onclick="switchTab('lessons')">К урокам</button>
    <button class="btn ghost full" onclick="switchTab('vocab')">Открыть Словарь</button>`;
}

function bootKpopLingua() { syncResources(); renderLessons(); }
if (window.AppData) window.AppData.whenReady(bootKpopLingua);
else bootKpopLingua();

document.addEventListener('app:data-ready', function () {
  const active = document.querySelector('.screen.active');
  if (!active) return;
  if (active.id === 'screen-lessons') renderLessons();
  if (active.id === 'screen-vocab') renderVocab();
  if (active.id === 'screen-social' && typeof window.renderSocial === 'function') window.renderSocial();
  if (active.id === 'screen-binder' && typeof window.renderBinder === 'function') window.renderBinder();
  if (active.id === 'screen-rank' && typeof window.renderRank === 'function') window.renderRank();
});

setInterval(syncResources, 30000);
</script>
