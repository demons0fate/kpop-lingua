<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-Pop Lingua</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='25'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="js/telegram.js?v=1"></script>
<style>
:root {
  --bg: #0b0814; --surface: #161124; --surface-2: #221b36;
  --accent: #ff2e93; --purple: #8a2be2; --cyan: #00e5ff;
  --gold: #ffd700; --success: #00e676; --danger: #ff4757;
  --text: #ffffff; --muted: #988fb3;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 92px; user-select: none; overflow-x: hidden; }
svg { display: block; flex-shrink: 0; }

#confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

.header { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: rgba(18,13,30,0.92); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.07); position: sticky; top: 0; z-index: 20; gap: 8px; }
.brand { font-weight: 900; font-size: 15px; letter-spacing: 0.3px; background: linear-gradient(90deg, #ff7ac6, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
.stats { display: flex; gap: 6px; align-items: center; }
.pill { background: var(--surface-2); border: 1px solid rgba(255,255,255,0.1); padding: 5px 9px; border-radius: 16px; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; transition: transform 0.2s var(--spring); }
.pill:active { transform: scale(0.92); }
.pill.energy { border-color: rgba(0,229,255,0.4); background: rgba(0,229,255,0.1); color: #bdf7ff; }
.pill.streak { border-color: rgba(255,184,0,0.45); background: linear-gradient(135deg, rgba(255,120,0,0.2), rgba(255,215,0,0.12)); color: #ffd48a; }
.pill.coins { border-color: rgba(255,46,147,0.45); background: rgba(255,46,147,0.12); color: #ffb3dc; }
.pill.xp { border-color: rgba(255,215,0,0.4); background: rgba(255,215,0,0.1); color: #ffe98a; }

.screen { display: none; padding: 16px; animation: screenIn 0.28s var(--spring); }
.screen.active { display: block; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

.module-banner { background: linear-gradient(135deg, #2a124a, #4d1143); border: 1px solid rgba(255,46,147,0.4); border-radius: 22px; padding: 18px; margin-bottom: 16px; box-shadow: 0 10px 28px rgba(77,17,67,0.28); }
.module-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.module-tag { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 10px; color: #ff99d6; }
.module-banner h2 { margin: 0 0 6px; font-size: 20px; }
.module-banner p { margin: 0 0 12px; font-size: 13px; color: #d8cce8; line-height: 1.4; }
.bar-bg { background: rgba(0,0,0,0.4); height: 8px; border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 8px; transition: width 0.45s var(--spring); }

/* Вертикальная тропа уроков (Duolingo-style) */
.lesson-path { position: relative; padding: 4px 0 10px; }
.lesson-path::before { content: ''; position: absolute; top: 12px; bottom: 12px; left: 50%; width: 3px; transform: translateX(-50%); background: repeating-linear-gradient(180deg, rgba(255,255,255,0.12) 0 9px, transparent 9px 19px); border-radius: 3px; z-index: 0; }
.path-row { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding-top: 28px; margin-bottom: 8px; transform: translateX(var(--ox, 0px)); }
.path-node { width: 74px; height: 74px; border: none; border-radius: 50%; font-size: 26px; font-weight: 900; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.16s var(--spring), box-shadow 0.2s, filter 0.2s; }
.path-node:active { transform: translateY(4px) scale(0.97); }
.path-node.exam { width: 86px; height: 86px; font-size: 30px; }
.path-node.done { background: linear-gradient(160deg, #35d98a, #0e9f5b); box-shadow: 0 6px 0 #076b3c, 0 10px 20px rgba(0,230,118,0.22); }
.path-node.done.exam { background: linear-gradient(160deg, #ffe27a, #ffb300); color: #3a2200; box-shadow: 0 6px 0 #8a5a00, 0 10px 22px rgba(255,215,0,0.25); }
.path-node.open { background: linear-gradient(160deg, #3a2a63, #241a3f); color: #c9bff0; box-shadow: 0 6px 0 #120d1e; }
.path-node.active { background: linear-gradient(160deg, var(--accent), #7a2cff); box-shadow: 0 6px 0 #6a0b46, 0 0 0 4px rgba(255,46,147,0.16), 0 0 24px rgba(255,46,147,0.5); animation: nodePulse 2.2s ease-in-out infinite; }
.path-node.active.exam { background: linear-gradient(160deg, #ffd54a, #ff8a00); color: #2a1500; box-shadow: 0 6px 0 #8a4a00, 0 0 0 4px rgba(255,215,0,0.18), 0 0 26px rgba(255,184,0,0.55); animation: nodePulseGold 2.2s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow: 0 6px 0 #6a0b46, 0 0 0 4px rgba(255,46,147,0.16), 0 0 20px rgba(255,46,147,0.42); } 50% { box-shadow: 0 6px 0 #6a0b46, 0 0 0 8px rgba(255,46,147,0.07), 0 0 34px rgba(255,46,147,0.68); } }
@keyframes nodePulseGold { 0%,100% { box-shadow: 0 6px 0 #8a4a00, 0 0 0 4px rgba(255,215,0,0.16), 0 0 20px rgba(255,184,0,0.45); } 50% { box-shadow: 0 6px 0 #8a4a00, 0 0 0 8px rgba(255,215,0,0.07), 0 0 34px rgba(255,184,0,0.7); } }
.path-node.locked { background: linear-gradient(160deg, #241d34, #171122); color: #6f6688; font-size: 24px; box-shadow: 0 6px 0 #0d0a16; }
.path-start-badge { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ff2e93, #8a2be2); color: #fff; font-size: 10px; font-weight: 900; letter-spacing: 1.2px; padding: 5px 12px; border-radius: 10px; box-shadow: 0 4px 0 rgba(106,11,70,0.65), 0 0 18px rgba(255,46,147,0.5); white-space: nowrap; animation: badgeFloat 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes badgeFloat { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
.path-label { margin-top: 9px; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.4px; white-space: nowrap; }
.path-row.is-active .path-label { color: #fff; }
.path-popover { position: relative; z-index: 2; background: linear-gradient(160deg, #271c42, #150f24); border: 1px solid rgba(255,46,147,0.45); border-radius: 20px; padding: 14px 15px; margin: 4px 0 18px; box-shadow: 0 14px 30px rgba(0,0,0,0.5); animation: popIn 0.24s var(--spring); }
.path-popover.exam { border-color: rgba(255,215,0,0.5); }
@keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
.pop-title { font-size: 15px; font-weight: 800; line-height: 1.3; }
.pop-desc { font-size: 12px; color: var(--muted); margin: 5px 0 10px; line-height: 1.45; }
.pop-reward { display: inline-block; font-size: 11px; font-weight: 800; color: #ffd48a; background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.25); padding: 5px 10px; border-radius: 10px; margin-bottom: 12px; }
.path-popover .btn { width: 100%; padding: 13px 12px; font-size: 12.5px; }

.btn { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border: none; padding: 12px 18px; border-radius: 16px; font-weight: 900; font-size: 14px; cursor: pointer; flex-shrink: 0; letter-spacing: 0.3px; transition: transform 0.12s var(--spring), box-shadow 0.12s, filter 0.18s; box-shadow: 0 4px 0 rgba(120,10,70,0.6), 0 8px 18px rgba(255,46,147,0.18); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(120,10,70,0.6); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn:disabled:active { transform: none; }
.btn.full { width: 100%; padding: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; }
.btn.ghost { background: var(--surface-2); border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
.btn.ghost:active { box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
.btn.cyan { background: linear-gradient(135deg, #00c6ff, #0072ff); box-shadow: 0 4px 0 #004e8f, 0 8px 18px rgba(0,198,255,0.2); }
.btn.cyan:active { box-shadow: 0 1px 0 #004e8f; }
.btn.gold { background: linear-gradient(135deg, #ffb800, #ff6b00); color: #160c00; box-shadow: 0 4px 0 #8a4a00, 0 8px 18px rgba(255,184,0,0.22); }
.btn.gold:active { box-shadow: 0 1px 0 #8a4a00; }
.btn.locked-cta { background: var(--surface-2); color: var(--muted); box-shadow: 0 4px 0 rgba(0,0,0,0.35); text-transform: none; letter-spacing: 0.2px; }
.btn.locked-cta:disabled { opacity: 1; }

.study-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.close-btn { background: var(--surface-2); color: #fff; border: none; width: 36px; height: 36px; border-radius: 12px; font-size: 18px; cursor: pointer; }
.study-progress { flex: 1; }
.step-count { font-size: 12px; color: var(--muted); font-weight: 700; }
.retry-badge { display: inline-block; background: rgba(255,71,87,0.2); border: 1px solid var(--danger); color: #ff9aa3; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 10px; margin-bottom: 12px; }

.jump-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 10px; }
.jump-btn { min-width: 34px; height: 32px; padding: 0 8px; border-radius: 10px; background: var(--surface); border: 1px solid rgba(255,255,255,0.12); color: var(--muted); font-size: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
.jump-btn.active { background: rgba(0,229,255,0.18); border-color: var(--cyan); color: #fff; }

.card-box { background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 18px; margin-bottom: 16px; line-height: 1.55; }
.card-box h3 { margin: 0 0 10px; color: #ff85cb; font-size: 18px; }
.card-box p { margin: 0 0 10px; font-size: 14px; color: #e6e1f2; }
.tip-box { background: rgba(0,229,255,0.08); border-left: 3px solid var(--cyan); padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #ccf7ff; margin: 12px 0; }

.example-list { display: grid; gap: 9px; margin-top: 12px; }
.example-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); padding: 11px 13px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: transform 0.15s; }
.example-row:active { transform: scale(0.98); }
.ex-kr { font-size: 24px; font-weight: 800; min-width: 74px; }
.ex-info { flex: 1; padding: 0 10px; }
.ex-tr { font-size: 13px; color: var(--cyan); font-weight: 700; }
.ex-ru { font-size: 12px; color: var(--muted); }
.ex-play { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,46,147,0.2); color: #ff7ac6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.prompt-word { text-align: center; background: linear-gradient(180deg, rgba(138,43,226,0.2), rgba(255,46,147,0.1)); border: 1px solid rgba(138,43,226,0.4); border-radius: 20px; padding: 20px 16px; margin-bottom: 16px; }
.big-kr { font-size: 44px; font-weight: 800; letter-spacing: 2px; }
.big-tr { font-size: 14px; color: var(--cyan); margin-top: 6px; font-weight: 600; }
.audio-pill { margin-top: 12px; background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 24px; font-weight: 700; font-size: 14px; cursor: pointer; }
.listen-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 4px; }
.big-listen-btn { width: 78px; height: 78px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--purple)); border: none; color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 0 24px rgba(255,46,147,0.45); display: flex; align-items: center; justify-content: center; }
.slow-listen-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); border: 1.5px solid rgba(0,229,255,0.45); color: #fff; font-size: 20px; cursor: pointer; }
.big-listen-btn:active, .slow-listen-btn:active { transform: scale(0.9); }

.opt-btn { display: block; width: 100%; text-align: left; background: var(--surface); border: 1.5px solid rgba(255,255,255,0.1); color: #fff; padding: 14px 16px; border-radius: 14px; margin-bottom: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.15s var(--spring), border-color 0.2s; }
.opt-btn:active { transform: scale(0.98); }
.opt-btn.correct { background: rgba(0,230,118,0.18); border-color: var(--success); }
.opt-btn.wrong { background: rgba(255,71,87,0.18); border-color: var(--danger); }

.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.match-col { display: flex; flex-direction: column; gap: 10px; }
.match-btn { background: var(--surface); border: 1.5px solid rgba(255,255,255,0.12); color: #fff; padding: 14px 10px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; min-height: 54px; transition: 0.15s var(--spring); }
.match-btn.kr { font-size: 20px; }
.match-btn.sel { border-color: var(--cyan); background: rgba(0,229,255,0.16); transform: scale(1.02); }
.match-btn.matched { opacity: 0.22; border-color: var(--success); background: rgba(0,230,118,0.15); pointer-events: none; transform: scale(0.95); }
.match-btn.wrong { border-color: var(--danger); background: rgba(255,71,87,0.25); }

.build-slots { min-height: 64px; background: var(--surface); border: 2px dashed rgba(255,255,255,0.18); border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 16px; }
.build-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
.chip { background: var(--surface-2); border: 1.5px solid rgba(255,255,255,0.15); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 20px; font-weight: 800; cursor: pointer; transition: transform 0.15s var(--spring); }
.chip:active { transform: scale(0.9); }
.chip.used { opacity: 0.22; pointer-events: none; }
.chip.in-slot { background: rgba(138,43,226,0.35); border-color: var(--purple); }
.chip.chip-space { min-width: 58px; color: var(--cyan); font-size: 15px; letter-spacing: 0; }

/* Drawing / Propisi */
.mode-switch { display: flex; background: var(--surface); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08); }
.mode-btn { flex: 1; border: none; background: transparent; color: var(--muted); padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.mode-btn.active { background: var(--surface-2); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }

.draw-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.draw-meta-title { font-size: 17px; font-weight: 800; color: #fff; }
.draw-hint { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.draw-stage { position: relative; width: 100%; aspect-ratio: 4 / 3; min-height: 250px; margin: 0 auto 14px; border-radius: 20px; background: #262733; border: 2px solid rgba(255,255,255,0.12); box-shadow: inset 0 0 24px rgba(0,0,0,0.35); overflow: hidden; touch-action: none; }
.draw-stage canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
.draw-controls { display: flex; gap: 8px; margin-bottom: 12px; }
.draw-controls .btn { flex: 1; padding: 12px 10px; font-size: 13px; }

/* Vocab & True 3D Flashcards */
.vocab-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.vocab-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer; transition: transform 0.15s; }
.vocab-row:active { transform: scale(0.98); }
.vocab-tag { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, rgba(255,46,147,0.2), rgba(0,229,255,0.15)); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #ff99d6; flex-shrink: 0; }

.fc-scene { perspective: 1100px; margin: 14px 0 18px; height: 290px; }
.fc-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s var(--spring); cursor: pointer; }
.fc-inner.flipped { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 14px 34px rgba(0,0,0,0.45); overflow: hidden; }
.fc-front { background: radial-gradient(circle at 20% 20%, rgba(0,229,255,0.18), transparent 55%), linear-gradient(155deg, #21183b, #120d21); border: 1.5px solid rgba(0,229,255,0.38); }
.fc-back { background: radial-gradient(circle at 80% 20%, rgba(255,46,147,0.22), transparent 55%), linear-gradient(155deg, #301438, #140e24); border: 1.5px solid rgba(255,46,147,0.5); transform: rotateY(180deg); }
.fc-badge { position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 800; color: var(--cyan); background: rgba(0,229,255,0.12); padding: 4px 10px; border-radius: 10px; }
.fc-kr { font-size: 48px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 24px rgba(0,229,255,0.3); }
.fc-tr { font-size: 18px; color: var(--cyan); font-weight: 700; margin-top: 8px; }
.fc-ru { font-size: 24px; font-weight: 800; color: #fff; margin-top: 10px; }
.fc-hint { position: absolute; bottom: 16px; font-size: 11px; color: var(--muted); letter-spacing: 0.3px; }
.fc-nav { display: flex; gap: 10px; }
.fc-nav .btn { flex: 1; }

/* Photocard Binder + Holographic Shimmer */
.tabs-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
.subtab { background: var(--surface); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.subtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.bias-banner { background: linear-gradient(135deg, rgba(255,46,147,0.16), rgba(0,229,255,0.12)); border: 1px solid rgba(255,46,147,0.4); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.binder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.photocard { background: linear-gradient(160deg, #251e3d, #140f24); border-radius: 18px; padding: 10px; text-align: center; border: 1.5px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s var(--spring); }
.photocard:active { transform: scale(0.95); }
.photocard.locked { filter: grayscale(1) opacity(0.42); cursor: default; }
.photocard.sr { border-color: #c278ff; box-shadow: 0 0 14px rgba(194,120,255,0.22); }
.photocard.ssr { border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
.photocard.bias-active { outline: 2px solid var(--cyan); outline-offset: 2px; }
.photocard.sr::after, .photocard.ssr::after { content: ''; position: absolute; inset: -60%; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.22) 50%, transparent 65%); transform: rotate(18deg); animation: holo 3.8s infinite linear; pointer-events: none; }
@keyframes holo { 0% { transform: translateX(-110%) rotate(18deg); } 100% { transform: translateX(110%) rotate(18deg); } }

.pc-rarity { position: absolute; top: 14px; right: 14px; z-index: 2; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 8px; background: rgba(10,8,18,0.75); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.18); }
.pc-bias-tag { position: absolute; top: 14px; left: 14px; z-index: 2; font-size: 9px; font-weight: 900; padding: 3px 7px; border-radius: 8px; background: var(--cyan); color: #09121a; }
.pc-art { height: 145px; border-radius: 13px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 9px; }
.pc-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pc-monogram { font-size: 38px; font-weight: 900; letter-spacing: 2px; color: rgba(255,255,255,0.85); text-shadow: 0 0 18px rgba(255,46,147,0.6); }
.pc-name { font-weight: 800; font-size: 13px; }

<script>
const tg = window.Telegram && window.Telegram.WebApp;

/* Данные приходят из data/*.json асинхронно. До загрузки — пустые массивы,
   чтобы интерфейс не падал при быстром клике по вкладкам. */
window.LESSONS = window.LESSONS || [];
window.CARDS = window.CARDS || [];
window.ERAS = window.ERAS || [];
window.VOCAB = window.VOCAB || [];
window.RULES = window.RULES || [];
window.MODULES = window.MODULES || [];

/* Экранирование пользовательских строк перед вставкой в innerHTML. */
function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
window.escapeHtml = escapeHtml;

/* ====== ВИБРООТКЛИК + ЗВУКИ + КОНФЕТТИ ====== */
function haptic(type = 'light') {
  if (window.KPLTelegram) return window.KPLTelegram.haptic(type);
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (type === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'err') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred(type);
  } catch (e) {}
}

/* Звуки интерфейса создаются только после жеста пользователя, иначе Chrome
   пишет в консоль «AudioContext was not allowed to start». */
let audioCtx = null;
function sfx(type) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) {
      try { if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; } catch (e) {}
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const playTone = (freq, start, dur, wave = 'sine', vol = 0.08) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = wave; o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(vol, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start + dur);
    };
    if (type === 'ok') { playTone(523.25, t, 0.12); playTone(783.99, t + 0.08, 0.18); }
    else if (type === 'err') { playTone(220, t, 0.15, 'triangle', 0.1); playTone(165, t + 0.09, 0.2, 'triangle', 0.1); }
    else if (type === 'win') { [523, 659, 784, 1046].forEach((f, i) => playTone(f, t + i * 0.08, 0.22)); }
    else if (type === 'tap') { playTone(440, t, 0.05, 'sine', 0.04); }
  } catch (e) {}
}

function fireConfetti() {
  const c = document.getElementById('confetti-canvas');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const colors = ['#ff2e93', '#00e5ff', '#ffd700', '#8a2be2', '#00e676'];
  const parts = Array.from({ length: 65 }, () => ({
    x: c.width / 2, y: c.height * 0.42,
    vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.85) * 14,
    s: Math.random() * 6 + 4, col: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360, vr: (Math.random() - 0.5) * 12, life: 1
  }));
  const tick = () => {
    ctx.clearRect(0, 0, c.width, c.height);
    let alive = false;
    parts.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.vr; p.life -= 0.018;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    });
    if (alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, c.width, c.height);
  };
  tick();
}

const MAX_ENERGY = 5;
const BASE_ENERGY_MS = 2 * 60 * 60 * 1000;

/* VOCAB загружается из data/vocab.json через data-loader.js. */

let st = {
  coins: 50, xp: 0, done: [], cards: [], drawn: [],
  energy: MAX_ENERGY, lastEnergyTs: Date.now()
};
try {
  const s = localStorage.getItem('kp_lingua_v4');
  if (s) {
    st = { ...st, ...JSON.parse(s) };
    if (!Array.isArray(st.done)) st.done = [];
    if (!Array.isArray(st.cards)) st.cards = [];
    if (!Array.isArray(st.drawn)) st.drawn = [];
    if (typeof st.energy !== 'number') { st.energy = MAX_ENERGY; st.lastEnergyTs = Date.now(); }
  }
} catch (e) {}

/* Базовая скорость восстановления: 1 лайтстик каждые 2 часа.
   studio.js возвращает это же значение (без бонусов состава). */
function getEnergyRegenMs() {
  return BASE_ENERGY_MS;
}

function syncResources() {
  const now = Date.now(), eMs = getEnergyRegenMs();
  let changed = false;
  if (st.energy < MAX_ENERGY) {
    const g = Math.floor((now - st.lastEnergyTs) / eMs);
    if (g > 0) {
      st.energy = Math.min(MAX_ENERGY, st.energy + g);
      st.lastEnergyTs = st.energy >= MAX_ENERGY ? now : st.lastEnergyTs + g * eMs;
      changed = true;
    }
  }
  if (changed) save(false);
  document.getElementById('energy-val').innerText = `${st.energy}/${MAX_ENERGY}`;
  document.getElementById('streak-val').innerText = (st.streak && st.streak.count) || 1;
  document.getElementById('coins-val').innerText = st.coins;
  document.getElementById('xp-val').innerText = st.xp;
}

function fmtWait(ms) {
  const m = Math.max(1, Math.ceil(ms / 60000));
  const h = Math.floor(m / 60), rm = m % 60;
  return h > 0 ? `${h}ч ${rm}м` : `${rm} мин`;
}

function save(doSync = true) {
  try { localStorage.setItem('kp_lingua_v4', JSON.stringify(st)); } catch (e) {}
  if (doSync) syncResources();
}

/* Мини-магазин живёт в studio.js (#pack-modal). Здесь только покупка энергии,
   чтобы inline-скрипт не зависел от порядка загрузки. */
function buyEnergy(amount, price) {
  syncResources();
  if (st.energy >= MAX_ENERGY) return alert('Энергия уже полная!');
  if (st.coins < price) return alert(`Нужно ${price} микрофонов.`);
  st.coins -= price; st.energy = Math.min(MAX_ENERGY, st.energy + amount);
  if (st.energy >= MAX_ENERGY) st.lastEnergyTs = Date.now();
  haptic('ok'); sfx('ok'); save();
  if (typeof window.openQuickShop === 'function') window.openQuickShop();
}

let curAudio = null;
function playAudio(file, text, rate = 1.0) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  const fallback = () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = rate * 0.85;
      window.speechSynthesis.speak(u);
    }
  };
  if (!file) return fallback();
  const a = new Audio(file); a.playbackRate = rate; curAudio = a;
  a.onerror = fallback; a.play().catch(fallback);
}

function switchTab(t) {
  haptic('light'); syncResources();
  if (t === 'shop') {
    if (typeof window.openQuickShop === 'function') window.openQuickShop();
    return;
  }
  const target = document.getElementById('screen-' + t);
  if (!target) return;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  target.classList.add('active');
  const nav = document.getElementById('nav-' + t);
  if (nav) nav.classList.add('active');
  if (t === 'lessons') renderLessons();
  if (t === 'vocab') renderVocab();
  if (t === 'binder') renderBinder();
  if (t === 'rank') renderRank();
}

/* ====== СЛОВАРЬ, 3D-КАРТОЧКИ И ДИКТАНТ ====== */
let vocabMode = 'list', vocabDeck = [], fcIdx = 0, fcFlipped = false;
let dictDeck = [], dictIdx = 0;

function getUnlockedVocab() { return VOCAB.filter(w => st.done.includes(w.l)); }
function setVocabMode(m) {
  haptic('light'); vocabMode = m;
  document.getElementById('vmode-list').classList.toggle('active', m === 'list');
  document.getElementById('vmode-cards').classList.toggle('active', m === 'cards');
  document.getElementById('vmode-dict').classList.toggle('active', m === 'dict');
  fcIdx = 0; fcFlipped = false; vocabDeck = getUnlockedVocab();
  dictIdx = 0; dictDeck = shuffle(getUnlockedVocab());
  renderVocab();
}

function renderVocab() {
  const unlocked = getUnlockedVocab();
  document.getElementById('vocab-count').innerText = `${unlocked.length} / ${VOCAB.length}`;
  const body = document.getElementById('vocab-body'); body.innerHTML = '';

  if (!unlocked.length) {
    body.innerHTML = `<div class="card-box" style="text-align:center;padding:28px 18px"><h3>Словарь пока пуст</h3><p style="color:var(--muted)">Пройди <b>Урок 1</b>, и все изученные слова автоматически появятся здесь для повторения и диктанта!</p><button class="btn" style="margin-top:8px" onclick="switchTab('lessons')">К урокам</button></div>`;
    return;
  }

  if (vocabMode === 'list') {
    unlocked.forEach(w => {
      const row = document.createElement('div'); row.className = 'vocab-row';
      row.innerHTML = `
        <div class="vocab-tag">${w.kr[0]}</div>
        <div style="flex:1">
          <div style="font-size:20px;font-weight:800">${w.kr} <span style="font-size:13px;color:var(--cyan);font-weight:700">${w.tr}</span></div>
          <div style="font-size:13px;color:var(--muted)">${w.ru}</div>
        </div>
        <div class="ex-play">🔊</div>`;
      row.onclick = () => { haptic('light'); playAudio(w.file, w.kr); };
      body.appendChild(row);
    });
  } else if (vocabMode === 'cards') {
    if (!vocabDeck.length || vocabDeck.length !== unlocked.length) vocabDeck = [...unlocked];
    if (fcIdx >= vocabDeck.length) fcIdx = 0;
    const w = vocabDeck[fcIdx];

    body.innerHTML = `
      <div style="text-align:center;font-size:12px;color:var(--muted);font-weight:700">Карточка ${fcIdx + 1} из ${vocabDeck.length}</div>
      <div class="fc-scene">
        <div class="fc-inner ${fcFlipped ? 'flipped' : ''}" id="fc-card">
          <div class="fc-face fc-front">
            <div class="fc-badge">Урок ${w.l}</div>
            <div class="fc-kr">${w.kr}</div>
            <button class="audio-pill" id="fc-audio">🔊 Послушать</button>
            <div class="fc-hint">Нажми на карточку, чтобы перевернуть</div>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-badge" style="color:#ff85cb;background:rgba(255,46,147,0.16)">Перевод</div>
            <div class="fc-kr" style="font-size:36px">${w.kr}</div>
            <div class="fc-tr">${w.tr}</div>
            <div class="fc-ru">${w.ru}</div>
            <div class="fc-hint">Нажми ещё раз, чтобы вернуть</div>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="btn ghost" id="fc-prev">← Назад</button>
        <button class="btn ghost" id="fc-shuf">Перемешать</button>
        <button class="btn cyan" id="fc-next">Дальше →</button>
      </div>
    `;

    document.getElementById('fc-card').onclick = (e) => {
      if (e.target.id === 'fc-audio') return;
      haptic('light'); sfx('tap');
      fcFlipped = !fcFlipped;
      document.getElementById('fc-card').classList.toggle('flipped', fcFlipped);
      if (fcFlipped && window.trackQuest) window.trackQuest('card', w.kr);
    };
    document.getElementById('fc-audio').onclick = (e) => { e.stopPropagation(); haptic('light'); playAudio(w.file, w.kr); };
    document.getElementById('fc-prev').onclick = () => { haptic('light'); fcIdx = (fcIdx - 1 + vocabDeck.length) % vocabDeck.length; fcFlipped = false; renderVocab(); };
    document.getElementById('fc-next').onclick = () => { haptic('light'); fcIdx = (fcIdx + 1) % vocabDeck.length; fcFlipped = false; renderVocab(); };
    document.getElementById('fc-shuf').onclick = () => { haptic('light'); vocabDeck = shuffle(unlocked); fcIdx = 0; fcFlipped = false; renderVocab(); };
  } else {
    if (!dictDeck.length || dictDeck.length !== unlocked.length) dictDeck = shuffle(unlocked);
    if (dictIdx >= dictDeck.length) { dictDeck = shuffle(unlocked); dictIdx = 0; }
    const w = dictDeck[dictIdx];
    const isNew = !st.drawn.includes(w.kr);

    const topInfo = document.createElement('div');
    topInfo.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted);font-weight:700';
    topInfo.innerHTML = `<span>Слово ${dictIdx + 1} из ${dictDeck.length}</span><span style="color:${isNew ? 'var(--cyan)' : 'var(--success)'}">${isNew ? '+5 микрофонов за 1-й раз' : '✓ Уже записано'}</span>`;

    const widgetWrap = document.createElement('div');
    const navRow = document.createElement('div');
    navRow.className = 'fc-nav';
    navRow.innerHTML = `<button class="btn ghost" id="dict-skip">Другое слово</button><button class="btn cyan" id="dict-next" style="display:none">Следующее →</button>`;

    body.append(topInfo, widgetWrap, navRow);

    const nextBtn = document.getElementById('dict-next');
    document.getElementById('dict-skip').onclick = () => { haptic('light'); dictIdx = (dictIdx + 1) % dictDeck.length; renderVocab(); };
    nextBtn.onclick = () => { haptic('light'); dictIdx = (dictIdx + 1) % dictDeck.length; renderVocab(); };

    mountDrawWidget(widgetWrap, w, true, () => {
      if (!st.drawn.includes(w.kr)) {
        st.drawn.push(w.kr); st.coins += 5; st.xp += 10; save();
      }
      if (window.trackQuest) window.trackQuest('dict', w.kr);
      nextBtn.style.display = 'block';
    });
  }
}

/* ====== РАСПОЗНАВАНИЕ ПОЧЕРКА ====== */
async function recognizeKoreanStrokes(strokes, w, h) {
  const res = await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ options: 'enable_pre_space', requests: [{ writing_guide: { writing_area_width: w, writing_area_height: h }, ink: strokes, language: 'ko' }] })
  });
  const data = await res.json();
  if (data[0] === 'SUCCESS' && data[1] && data[1][0] && Array.isArray(data[1][0][1])) return data[1][0][1];
  throw new Error('IME empty');
}

function fallbackSectorCheck(inkC, targetText, FONT, W, H) {
  const getBox = (ctx) => {
    const d = ctx.getImageData(0, 0, W, H).data;
    let minX = W, minY = H, maxX = -1, maxY = -1, c = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 35) { c++; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    return { minX, minY, w: maxX - minX + 1, h: maxY - minY + 1, c };
  };
  const norm = (src, b, N = 64) => {
    const c = document.createElement('canvas'); c.width = N; c.height = N;
    const ctx = c.getContext('2d'); const sc = Math.min((N - 12) / b.w, (N - 12) / b.h);
    ctx.drawImage(src, b.minX, b.minY, b.w, b.h, (N - b.w * sc) / 2, (N - b.h * sc) / 2, b.w * sc, b.h * sc);
    const d = ctx.getImageData(0, 0, N, N).data; const bin = new Uint8Array(N * N);
    for (let i = 0; i < N * N; i++) if (d[i * 4 + 3] > 30) bin[i] = 1;
    return bin;
  };
  const dil = (bin, N, r) => {
    const o = new Uint8Array(N * N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (bin[y * N + x])
      for (let yy = Math.max(0, y - r); yy <= Math.min(N - 1, y + r); yy++)
        for (let xx = Math.max(0, x - r); xx <= Math.min(N - 1, x + r); xx++) o[yy * N + xx] = 1;
    return o;
  };
  const uBox = getBox(inkC.getContext('2d'));
  const tC = document.createElement('canvas'); tC.width = W; tC.height = H;
  const tCtx = tC.getContext('2d'); tCtx.font = FONT; tCtx.textAlign = 'center'; tCtx.textBaseline = 'middle'; tCtx.fillStyle = '#fff';
  tCtx.fillText(targetText, W / 2, H / 2 + 6);
  const tBox = getBox(tCtx);
  const N = 64, uB = norm(inkC, uBox, N), tB = norm(tC, tBox, N);
  const uD = dil(uB, N, 2), tD = dil(tB, N, 2);
  for (let sy = 0; sy < 2; sy++) for (let sx = 0; sx < 2; sx++) {
    let tt = 0, th = 0;
    for (let y = sy * 32; y < (sy + 1) * 32; y++) for (let x = sx * 32; x < (sx + 1) * 32; x++) if (tB[y * N + x]) { tt++; if (uD[y * N + x]) th++; }
    if (tt > 15 && th / tt < 0.45) return false;
  }
  let ut = 0, uh = 0;
  for (let i = 0; i < N * N; i++) if (uB[i]) { ut++; if (tD[i]) uh++; }
  return ut > 0 && (uh / ut) >= 0.55;
}

function mountDrawWidget(container, item, blindMode, onSuccess, onFail, noPeek = false) {
  const W = 400, H = 300;
  const len = item.kr.length;
  const fontSize = len === 1 ? 155 : (len === 2 ? 115 : 88);
  const FONT = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;

  container.innerHTML = `
    <div class="card-box" style="padding:15px">
      <div class="draw-header">
        <div>
          <div class="draw-meta-title">${blindMode ? 'Напиши на слух: ' + (item.ru || item.tr) : 'Напиши: ' + item.kr + ' ' + (item.tr || '')}</div>
          <div class="draw-hint">${noPeek ? 'Режим экзамена — без подсказок!' : 'Пиши в любом месте поля — система прочитает твой почерк'}</div>
        </div>
        <button class="ex-play" style="border:none;cursor:pointer;width:42px;height:42px;font-size:18px" id="dw-audio">🔊</button>
      </div>
      <div class="draw-stage">
        <canvas id="dw-guide" width="${W}" height="${H}"></canvas>
        <canvas id="dw-ink" width="${W}" height="${H}"></canvas>
      </div>
      <div class="draw-controls">
        <button class="btn ghost" id="dw-clear">Стереть</button>
        ${(blindMode && !noPeek) ? '<button class="btn ghost" id="dw-peek">Подсказка</button>' : ''}
        <button class="btn" id="dw-check">Проверить</button>
      </div>
      <div id="dw-fb" class="feedback-bar" style="margin-bottom:0"></div>
    </div>
  `;

  document.getElementById('dw-audio').onclick = () => playAudio(item.file, item.kr);
  if (blindMode) setTimeout(() => playAudio(item.file, item.kr), 200);

  const guideC = document.getElementById('dw-guide'), gCtx = guideC.getContext('2d');
  const inkC = document.getElementById('dw-ink'), iCtx = inkC.getContext('2d');
  const drawGuide = (showGhost) => {
    gCtx.clearRect(0, 0, W, H);
    if (showGhost) { gCtx.font = FONT; gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle'; gCtx.fillStyle = 'rgba(255,255,255,0.14)'; gCtx.fillText(item.kr, W / 2, H / 2 + 6); }
  };
  drawGuide(!blindMode);

  const peekBtn = document.getElementById('dw-peek');
  if (peekBtn) peekBtn.onclick = () => { drawGuide(true); setTimeout(() => drawGuide(false), 1600); };

  let drawing = false, lastX = 0, lastY = 0, strokes = [], curStroke = null, startTime = 0;
  iCtx.strokeStyle = '#ffffff'; iCtx.lineWidth = 7; iCtx.lineCap = 'round'; iCtx.lineJoin = 'round';
  const getPos = (e) => { const r = inkC.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };

  inkC.addEventListener('pointerdown', (e) => {
    e.preventDefault(); inkC.setPointerCapture(e.pointerId); drawing = true; const p = getPos(e);
    if (!strokes.length) startTime = Date.now();
    curStroke = [[Math.round(p.x)], [Math.round(p.y)], [Date.now() - startTime]]; strokes.push(curStroke);
    lastX = p.x; lastY = p.y; iCtx.beginPath(); iCtx.moveTo(p.x, p.y); iCtx.lineTo(p.x + 0.1, p.y + 0.1); iCtx.stroke();
  });
  inkC.addEventListener('pointermove', (e) => {
    if (!drawing) return; e.preventDefault(); const p = getPos(e);
    if (Math.hypot(p.x - lastX, p.y - lastY) > 2) { curStroke[0].push(Math.round(p.x)); curStroke[1].push(Math.round(p.y)); curStroke[2].push(Date.now() - startTime); }
    iCtx.beginPath(); iCtx.moveTo(lastX, lastY); iCtx.lineTo(p.x, p.y); iCtx.stroke(); lastX = p.x; lastY = p.y;
  });
  const endDraw = () => { drawing = false; curStroke = null; };
  inkC.addEventListener('pointerup', endDraw); inkC.addEventListener('pointercancel', endDraw);

  const fb = document.getElementById('dw-fb'), checkBtn = document.getElementById('dw-check');
  document.getElementById('dw-clear').onclick = () => { haptic('light'); iCtx.clearRect(0, 0, W, H); strokes = []; fb.className = 'feedback-bar'; };

  checkBtn.onclick = async () => {
    if (!strokes.length) { fb.className = 'feedback-bar err'; fb.innerText = 'Сначала напиши букву или слово на поле!'; return; }
    checkBtn.disabled = true; checkBtn.innerText = 'Читаю...';
    const clean = s => s.replace(/\s+/g, ''); const target = clean(item.kr);
    try {
      const cands = await recognizeKoreanStrokes(strokes, W, H);
      if (cands.slice(0, 4).map(clean).includes(target)) {
        haptic('ok'); sfx('ok'); fb.className = 'feedback-bar ok'; fb.innerText = `Идеально! Распознано: «${item.kr}» ${item.tr || ''}`;
        playAudio(item.file, item.kr); if (onSuccess) onSuccess();
      } else {
        haptic('err'); sfx('err'); fb.className = 'feedback-bar err';
        fb.innerText = blindMode ? `Система прочитала это как «${cands[0] || '?'}». Попробуй ещё раз!` : `Прочитано как «${cands[0] || '?'}», а нужно «${item.kr}».`;
        if (onFail) onFail();
      }
    } catch (err) {
      if (fallbackSectorCheck(inkC, item.kr, FONT, W, H)) {
        haptic('ok'); sfx('ok'); fb.className = 'feedback-bar ok'; fb.innerText = `Отлично! Это «${item.kr}» ${item.tr || ''}`;
        playAudio(item.file, item.kr); if (onSuccess) onSuccess();
      } else {
        haptic('err'); sfx('err'); fb.className = 'feedback-bar err'; fb.innerText = 'Не совсем похоже. Сотри и напиши аккуратнее!';
        if (onFail) onFail();
      }
    } finally { checkBtn.disabled = false; checkBtn.innerText = 'Проверить'; }
  };
}

/* ====== УРОКИ И ДВИЖОК ====== */
function getModuleById(moduleId) {
  return (Array.isArray(MODULES) ? MODULES : []).find(m => m.id === moduleId) || null;
}

function getModuleLessons(moduleId) {
  return (Array.isArray(LESSONS) ? LESSONS : []).filter(l => l.moduleId === moduleId);
}

function getExamPeers(lesson) {
  const moduleId = lesson && lesson.moduleId;
  const scoped = moduleId ? getModuleLessons(moduleId).filter(l => !l.isExam) : [];
  return scoped.length ? scoped : LESSONS.filter(l => !l.isExam);
}

function isModuleExamPassed(moduleId) {
  return (Array.isArray(LESSONS) ? LESSONS : []).some(l => l.moduleId === moduleId && l.isExam && st.done.includes(l.id));
}

function getCurrentModule() {
  if (!Array.isArray(MODULES) || !MODULES.length) return null;
  return MODULES.find(m => (m.lessonIds || []).some(id => !st.done.includes(id))) || MODULES[MODULES.length - 1];
}

function isLessonUnlocked(l, idx) {
  if (st.done.includes(l.id)) return true;
  if (l.isExam) return getExamPeers(l).every(x => st.done.includes(x.id));
  return idx === 0 || st.done.includes(LESSONS[idx - 1].id);
}

/* Вертикальная тропа: смещение узлов «змейкой» и открытый поповер. */
const PATH_OFFSETS = [0, -42, -64, -42, 0, 42, 64, 42, 0];
let pathOpenId = null, pathInitDone = false;

/* Первый незавершённый урок, который уже открыт (обычно он один). */
function getActiveLessonId(lessons) {
  for (let i = 0; i < lessons.length; i++) {
    const l = lessons[i];
    if (!st.done.includes(l.id) && isLessonUnlocked(l, i)) return l.id;
  }
  return null;
}

function renderPathPopover(l, done, unlocked) {
  let action;
  if (done) {
    action = `<button class="btn full" data-start-id="${l.id}">ПОВТОРИТЬ • БЕСПЛАТНО</button>`;
  } else if (unlocked) {
    action = `<button class="btn full${l.isExam ? ' gold' : ''}" data-start-id="${l.id}">${l.isExam ? 'СДАТЬ ЭКЗАМЕН' : 'УЧИТЬ'} • 1 ⚡</button>`;
  } else {
    action = `<button class="btn full locked-cta" disabled>СНАЧАЛА ПРОЙДИ ПРЕДЫДУЩИЙ УРОК</button>`;
  }
  return `<div class="path-popover${l.isExam ? ' exam' : ''}">
    <div class="pop-title">${escapeHtml(l.title)}</div>
    <div class="pop-desc">${escapeHtml(l.desc || '')}</div>
    <div class="pop-reward">+${Number(l.coins) || 0} 🎤 • +${Number(l.xp) || 0} XP</div>
    ${action}
  </div>`;
}

function wirePathEvents(root) {
  root.querySelectorAll('.path-node').forEach(node => {
    node.addEventListener('click', () => {
      const id = Number(node.dataset.lessonId);
      haptic('light'); sfx('tap');
      pathOpenId = pathOpenId === id ? null : id;
      renderLessons();
    });
  });
  root.querySelectorAll('[data-start-id]').forEach(btn => {
    btn.addEventListener('click', () => startLesson(Number(btn.dataset.startId)));
  });
}

function renderLessons() {
  const list = document.getElementById('lessons-list');
  if (!list) return;
  const lessons = Array.isArray(LESSONS) ? LESSONS : [];
  if (!lessons.length) {
    list.innerHTML = window.APP_DATA_ERROR
      ? ''
      : '<div class="card-box" style="text-align:center">Загружаю уроки…</div>';
    return;
  }

  const activeModule = getCurrentModule();
  if (activeModule) {
    const moduleLessons = getModuleLessons(activeModule.id);
    const moduleDone = moduleLessons.filter(l => st.done.includes(l.id)).length;
    const tag = document.querySelector('#screen-lessons .module-tag');
    const title = document.querySelector('#screen-lessons .module-banner h2');
    const desc = document.querySelector('#screen-lessons .module-banner p');
    if (tag) tag.textContent = activeModule.tag || activeModule.title || '';
    if (title) title.textContent = activeModule.title || '';
    if (desc) desc.textContent = activeModule.desc || '';
    document.getElementById('module-progress').style.width = Math.round((moduleDone / Math.max(1, moduleLessons.length)) * 100) + '%';
  } else {
    document.getElementById('module-progress').style.width = Math.round((st.done.length / Math.max(1, lessons.length)) * 100) + '%';
  }

  const activeId = getActiveLessonId(lessons);
  if (!pathInitDone) {
    pathInitDone = true;
    pathOpenId = activeId;           // при первом рендере сразу раскрываем текущий урок
  } else if (pathOpenId !== null && st.done.includes(pathOpenId)) {
    pathOpenId = activeId;           // урок пройден — поповер переезжает к новому
  }

  const parts = [];
  let lastModuleId = null, nodeIdx = 0;
  lessons.forEach((l, idx) => {
    if (l.moduleId && l.moduleId !== lastModuleId) {
      lastModuleId = l.moduleId;
      const module = getModuleById(l.moduleId);
      if (module) {
        const moduleLessons = getModuleLessons(l.moduleId);
        const moduleDone = moduleLessons.filter(x => st.done.includes(x.id)).length;
        parts.push(`<div class="era-head"><span>${escapeHtml(module.tag || module.title || l.moduleId)}</span><span>${moduleDone}/${moduleLessons.length}</span></div>`);
      }
    }

    const done = st.done.includes(l.id);
    const unlocked = isLessonUnlocked(l, idx);
    const active = l.id === activeId;
    const state = done ? 'done' : (active ? 'active' : (unlocked ? 'open' : 'locked'));
    const ox = PATH_OFFSETS[nodeIdx % PATH_OFFSETS.length];
    nodeIdx++;
    const icon = done ? '✓' : (unlocked ? (l.isExam ? '🏆' : '▶') : '🔒');
    const label = l.isExam ? 'Экзамен' : `Урок ${l.id}`;
    const badge = active
      ? `<div class="path-start-badge">${l.isExam ? 'ЭКЗАМЕН' : 'СТАРТ'}</div>`
      : '';

    parts.push(`
      <div class="path-row${active ? ' is-active' : ''}" style="--ox:${ox}px">
        ${badge}
        <button class="path-node ${state}${l.isExam ? ' exam' : ''}" data-lesson-id="${l.id}" aria-label="${escapeHtml(l.title)}">${icon}</button>
        <div class="path-label">${label}</div>
      </div>`);

    if (pathOpenId === l.id) parts.push(renderPathPopover(l, done, unlocked));
  });

  list.innerHTML = `<div class="lesson-path">${parts.join('')}</div>`;
  wirePathEvents(list);
}

let curL = null, isReplay = false, queue = [], qIdx = 0, mistakes = 0, stepFailed = false, buildAns = [];
let lessonLoading = false;

async function startLesson(id) {
  if (lessonLoading) return;
  syncResources();
  const meta = (Array.isArray(LESSONS) ? LESSONS : []).find(x => x.id === id);
  if (!meta) return alert('Урок не найден. Обнови страницу.');
  const replay = st.done.includes(meta.id);

  if (!replay) {
    if (st.energy <= 0) {
      if (typeof window.openQuickShop === 'function') {
        window.openQuickShop('Закончились лайтстики ⚡!');
      } else {
        alert(`Закончились лайтстики ⚡!\n+1 заряд через ${fmtWait(getEnergyRegenMs() - (Date.now() - st.lastEnergyTs))}.`);
      }
      return;
    }
  }

  lessonLoading = true;
  let lesson = meta;
  try {
    // В индексе лежат только метаданные, полный урок грузим лениво.
    if (!Array.isArray(meta.steps) || !meta.steps.length) {
      if (!window.AppData) throw new Error('data loader is missing');
      lesson = await window.AppData.lesson(meta.id);
    }
  } catch (e) {
    lessonLoading = false;
    return alert('Не удалось загрузить урок. Проверь соединение и попробуй ещё раз.');
  }

  if (!Array.isArray(lesson.steps) || !lesson.steps.length) {
    lessonLoading = false;
    return alert('В этом уроке нет заданий. Проверь data/lessons/*.json.');
  }

  if (!replay) {
    if (st.energy <= 0) { lessonLoading = false; return; }
    if (st.energy === MAX_ENERGY) st.lastEnergyTs = Date.now();
    st.energy--; save();
  }

  curL = lesson;
  isReplay = replay;
  queue = lesson.steps.map(s => ({ ...s, isRetry: false }));
  qIdx = 0; mistakes = 0;
  lessonLoading = false;
  switchTab('study');
  renderStep();
}

function renderJumpBar() {
  if (!isReplay || !curL) return null;
  const bar = document.createElement('div'); bar.className = 'jump-bar';
  curL.steps.forEach((step, idx) => {
    const b = document.createElement('button');
    b.className = 'jump-btn' + (!queue[qIdx]?.isRetry && qIdx === idx ? ' active' : '');
    b.innerText = `${idx + 1}`;
    b.onclick = () => { if (idx < queue.length) { haptic('light'); qIdx = idx; renderStep(); } };
    bar.appendChild(b);
  });
  return bar;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalizeAnswer(parts) {
  return (Array.isArray(parts) ? parts : []).join('').replace(/\s+/g, '');
}

function renderStep() {
  const total = queue.length;
  document.getElementById('study-bar').style.width = Math.round((qIdx / total) * 100) + '%';
  document.getElementById('step-count').innerText = Math.min(qIdx + 1, total) + '/' + total;
  const body = document.getElementById('study-body'); body.innerHTML = ''; stepFailed = false;
  if (qIdx >= total) return finishLesson();
  const jumpBar = renderJumpBar(); if (jumpBar) body.appendChild(jumpBar);

  const s = queue[qIdx], isExam = !!(curL && curL.isExam);
  if (s.isRetry) body.innerHTML += '<div class="retry-badge">Работа над ошибками</div>';

  if (s.type === 'draw') {
    const drawList = Array.isArray(s.items) && s.items.length ? s.items : [s];
    let idx = 0;
    const prog = document.createElement('div'); prog.style.cssText = 'font-size:12px;color:var(--cyan);font-weight:700;margin-bottom:8px;text-align:center';
    const box = document.createElement('div');
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;
    body.append(prog, box, nextBtn);
    const runOne = () => {
      prog.innerText = `Пропись ${idx + 1} из ${drawList.length}`;
      mountDrawWidget(box, drawList[idx], isExam ? true : (s.blind !== false), () => {
        if (idx < drawList.length - 1) { idx++; setTimeout(runOne, 850); }
        else { prog.innerText = `Готово (${drawList.length}/${drawList.length})`; nextBtn.style.display = 'block'; }
      }, () => { if (!stepFailed) { stepFailed = true; mistakes++; } }, isExam);
    };
    runOne();
  }

  if (s.type === 'theory') {
    const wrap = document.createElement('div'); wrap.className = 'card-box';
    wrap.innerHTML = `<h3>${s.title}</h3><p>${s.text}</p>${s.tip ? `<div class="tip-box">${s.tip}</div>` : ''}`;
    const list = document.createElement('div'); list.className = 'example-list';
    s.examples.forEach(e => {
      const row = document.createElement('div'); row.className = 'example-row';
      row.innerHTML = `<div class="ex-kr">${e.kr}</div><div class="ex-info"><div class="ex-tr">${e.tr}</div><div class="ex-ru">${e.ru}</div></div><div class="ex-play">🔊</div>`;
      row.onclick = () => { haptic('light'); playAudio(e.file, e.kr); };
      list.appendChild(row);
    });
    wrap.appendChild(list); body.appendChild(wrap);
    const btn = document.createElement('button'); btn.className = 'btn full'; btn.innerText = 'Понятно, дальше →'; btn.onclick = nextStep; body.appendChild(btn);
  }

  if (s.type === 'choice' || s.type === 'listen') {
    const prompt = document.createElement('div'); prompt.className = 'prompt-word';
    if (s.type === 'listen') {
      prompt.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:4px">Аудирование • Нажми и слушай</div>`;
      const row = document.createElement('div'); row.className = 'listen-row';
      const lb = document.createElement('button'); lb.className = 'big-listen-btn'; lb.innerText = '🔊'; lb.onclick = () => playAudio(s.file, s.kr, 1.0);
      const sb = document.createElement('button'); sb.className = 'slow-listen-btn'; sb.innerText = '0.7x'; sb.style.fontSize = '13px'; sb.style.fontWeight = '800'; sb.onclick = () => playAudio(s.file, s.kr, 0.72);
      row.append(lb, sb); prompt.appendChild(row);
      const rev = document.createElement('div'); rev.id = 'listen-reveal'; rev.className = 'big-tr'; rev.style.visibility = 'hidden';
      rev.innerText = s.kr + ' ' + (s.tr || ''); prompt.appendChild(rev);
      setTimeout(() => playAudio(s.file, s.kr, 1.0), 250);
    } else {
      prompt.innerHTML = `<div class="big-kr">${s.kr}</div>${!isExam ? `<div class="big-tr">${s.tr || ''}</div>` : ''}`;
      const ab = document.createElement('button'); ab.className = 'audio-pill'; ab.innerText = '🔊 Послушать'; ab.onclick = () => playAudio(s.file, s.kr, 1.0);
      prompt.appendChild(ab);
    }
    body.appendChild(prompt);

    const h = document.createElement('h3'); h.style.cssText = 'margin:0 0 12px;font-size:16px'; h.innerText = s.q; body.appendChild(h);
    const optsWrap = document.createElement('div'), fb = document.createElement('div'); fb.className = 'feedback-bar';
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;

    s.opts.forEach((opt, i) => {
      const b = document.createElement('button'); b.className = 'opt-btn'; b.innerText = opt;
      b.onclick = () => {
        optsWrap.querySelectorAll('.opt-btn').forEach(x => x.disabled = true);
        const rev = document.getElementById('listen-reveal'); if (rev) rev.style.visibility = 'visible';
        if (i === s.correct) { haptic('ok'); sfx('ok'); b.classList.add('correct'); fb.className = 'feedback-bar ok'; fb.innerText = 'Верно! ' + s.explain; }
        else { haptic('err'); sfx('err'); b.classList.add('wrong'); optsWrap.children[s.correct].classList.add('correct'); fb.className = 'feedback-bar err'; fb.innerText = (isExam ? 'Ошибка. ' : 'Ошибка (вернёмся в конце). ') + s.explain; mistakes++; if (!isExam) queue.push({ ...s, isRetry: true }); }
        nextBtn.style.display = 'block';
      };
      optsWrap.appendChild(b);
    });
    body.append(optsWrap, fb, nextBtn);
  }

  if (s.type === 'match') {
    const h = document.createElement('h3'); h.style.cssText = 'margin:0 0 14px;font-size:16px'; h.innerText = s.q || 'Соедини пары'; body.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'match-grid';
    const colL = document.createElement('div'); colL.className = 'match-col';
    const colR = document.createElement('div'); colR.className = 'match-col';
    const fb = document.createElement('div'); fb.className = 'feedback-bar';
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;

    let selL = null, selR = null, matched = 0;
    const tryMatch = () => {
      if (!selL || !selR) return;
      if (selL.id === selR.id) {
        haptic('ok'); sfx('ok');
        selL.el.classList.remove('sel'); selR.el.classList.remove('sel');
        selL.el.classList.add('matched'); selR.el.classList.add('matched');
        playAudio(selL.file, selL.kr); matched++; selL = null; selR = null;
        if (matched === s.pairs.length) { fb.className = 'feedback-bar ok'; fb.innerText = 'Все пары собраны!'; nextBtn.style.display = 'block'; }
      } else {
        haptic('err'); sfx('err');
        const a = selL.el, b = selR.el; a.classList.add('wrong'); b.classList.add('wrong');
        mistakes++; selL = null; selR = null;
        setTimeout(() => { a.classList.remove('sel', 'wrong'); b.classList.remove('sel', 'wrong'); }, 450);
      }
    };

    shuffle(s.pairs.map((p, i) => ({ ...p, id: i }))).forEach(item => {
      const b = document.createElement('button'); b.className = 'match-btn kr'; b.innerText = item.kr;
      b.onclick = () => { haptic('light'); colL.querySelectorAll('.match-btn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); playAudio(item.file, item.kr); selL = { ...item, el: b }; tryMatch(); };
      colL.appendChild(b);
    });
    shuffle(s.pairs.map((p, i) => ({ ...p, id: i }))).forEach(item => {
      const b = document.createElement('button'); b.className = 'match-btn'; b.innerText = item.ru;
      b.onclick = () => { haptic('light'); colR.querySelectorAll('.match-btn').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); selR = { ...item, el: b }; tryMatch(); };
      colR.appendChild(b);
    });
    grid.append(colL, colR); body.append(grid, fb, nextBtn);
  }

  if (s.type === 'build' || s.type === 'listen_build') {
    buildAns = []; const isListen = s.type === 'listen_build';
    const prompt = document.createElement('div'); prompt.className = 'prompt-word'; prompt.style.padding = '16px';
    if (isListen) {
      prompt.innerHTML = `<div style="font-size:15px;font-weight:700;margin-bottom:4px">${s.q || 'Послушай и собери фразу'}</div>`;
      const row = document.createElement('div'); row.className = 'listen-row';
      const lb = document.createElement('button'); lb.className = 'big-listen-btn'; lb.innerText = '🔊'; lb.onclick = () => playAudio(s.file, s.audioText, 1.0);
      const sb = document.createElement('button'); sb.className = 'slow-listen-btn'; sb.innerText = '0.7x'; sb.style.fontSize = '13px'; sb.style.fontWeight = '800'; sb.onclick = () => playAudio(s.file, s.audioText, 0.72);
      row.append(lb, sb); prompt.appendChild(row);
      setTimeout(() => playAudio(s.file, s.audioText, 1.0), 250);
    } else {
      prompt.innerHTML = `<div style="font-size:16px;font-weight:700">${s.q}</div>`;
      if (!isExam) { const ab = document.createElement('button'); ab.className = 'audio-pill'; ab.innerText = '🔊 Подсказка'; ab.onclick = () => playAudio(s.file, s.audioText, 1.0); prompt.appendChild(ab); }
    }

    const slots = document.createElement('div'); slots.className = 'build-slots';
    const pool = document.createElement('div'); pool.className = 'build-pool';
    const fb = document.createElement('div'); fb.className = 'feedback-bar';
    const checkBtn = document.createElement('button'); checkBtn.className = 'btn full'; checkBtn.innerText = 'Проверить';
    const nextBtn = document.createElement('button'); nextBtn.className = 'btn full'; nextBtn.style.display = 'none'; nextBtn.innerText = 'Дальше →'; nextBtn.onclick = nextStep;

    const chipLabel = (val) => (val === ' ' ? '␣' : val);
    const renderBuild = () => {
      slots.innerHTML = buildAns.length ? '' : '<span style="color:var(--muted);font-size:13px">Нажимай на блоки ниже</span>';
      buildAns.forEach((item, pos) => {
        const c = document.createElement('button');
        c.className = 'chip in-slot' + (item.val === ' ' ? ' chip-space' : '');
        c.innerText = chipLabel(item.val);
        c.setAttribute('aria-label', item.val === ' ' ? 'Пробел' : item.val);
        c.onclick = () => { haptic('light'); sfx('tap'); buildAns.splice(pos, 1); renderBuild(); };
        slots.appendChild(c);
      });
      pool.innerHTML = '';
      s.pool.forEach((val, idx) => {
        const c = document.createElement('button');
        c.className = 'chip' + (val === ' ' ? ' chip-space' : '') + (buildAns.some(a => a.idx === idx) ? ' used' : '');
        c.innerText = chipLabel(val);
        c.setAttribute('aria-label', val === ' ' ? 'Пробел' : val);
        c.onclick = () => { haptic('light'); sfx('tap'); buildAns.push({ val, idx }); renderBuild(); };
        pool.appendChild(c);
      });
    };

    checkBtn.onclick = () => {
      if (normalizeAnswer(buildAns.map(a => a.val)) === normalizeAnswer(s.answer)) {
        haptic('ok'); sfx('ok'); fb.className = 'feedback-bar ok'; fb.innerText = s.explain;
        checkBtn.style.display = 'none'; nextBtn.style.display = 'block'; playAudio(s.file, s.audioText, 1.0);
      } else {
        haptic('err'); sfx('err'); fb.className = 'feedback-bar err'; fb.innerText = 'Не совсем так! Попробуй переставить блоки.';
        if (!stepFailed) { stepFailed = true; mistakes++; if (!isExam) queue.push({ ...s, isRetry: true }); }
      }
    };
    renderBuild(); body.append(prompt, slots, pool, fb, checkBtn, nextBtn);
  }
}

function nextStep() { haptic('light'); qIdx++; renderStep(); }

/* ====== НЕДЕЛЬНЫЙ XP (основа недельной лиги во вкладке «Лига») ====== */
const WEEKLY_XP_TRAINING = 5;    // повтор урока и тренировка в словаре/диктанте (+5 XP)

/* Единый недельный XP: те же очки, что и постоянный XP, но копятся за неделю. */
function addWeeklyXp(amount) {
  const n = Math.max(0, Math.round(Number(amount) || 0));
  if (!n) return 0;
  if (typeof st.weeklyXp !== 'number' || !isFinite(st.weeklyXp)) {
    st.weeklyXp = Math.max(0, Math.round(Number(st.weeklyHype) || 0));
  }
  st.weeklyXp += n;
  return n;
}
window.addWeeklyXp = addWeeklyXp;
window.addWeeklyHype = addWeeklyXp;   // обратная совместимость со старыми вызовами

/* Успешный шаг диктанта/аудио: +5 XP, засчитывается в дейлик и квест месяца. */
function awardDictationStep() {
  st.xp += WEEKLY_XP_TRAINING;
  const amount = addWeeklyXp(WEEKLY_XP_TRAINING);
  if (typeof window.trackQuest === 'function') window.trackQuest('dict');
  save();
  return amount;
}
window.awardDictationStep = awardDictationStep;

/* Единый расчёт наград за урок: база + таланты группы (studio.js) + комбо. */
function calcLessonRewards(lesson, replay) {
  const baseCoins = Number(lesson.coins) || 0;
  const baseXp = Number(lesson.xp) || 0;
  if (replay) {
    return {
      coins: Math.max(5, Math.round(baseCoins * 0.1)), xp: 5, hype: false, comboPct: 0
    };
  }
  const team = typeof window.getTeamBonuses === 'function'
    ? window.getTeamBonuses()
    : { coinsPct: 0, hypePct: 0 };
  const comboPct = typeof window.getLessonComboPct === 'function'
    ? window.getLessonComboPct()
    : 0;
  const xp = Math.round(baseXp * (1 + Math.max(0, comboPct) / 100));
  let coins = Math.round(baseCoins * (1 + Math.max(0, team.coinsPct || 0) / 100));
  const hype = (team.hypePct || 0) > 0 && Math.random() * 100 < team.hypePct;
  if (hype) coins += baseCoins;
  return { coins, xp, hype, comboPct };
}

function finishLesson() {
  document.getElementById('study-bar').style.width = '100%';
  if (curL.isExam && mistakes > 4) {
    haptic('err'); sfx('err');
    document.getElementById('study-body').innerHTML = `
      <div class="card-box" style="text-align:center;padding:26px 18px">
        <h2 style="margin:0 0 8px;color:var(--danger)">Экзамен не сдан</h2>
        <p>Допущено ошибок: <b>${mistakes}</b> (нужно не больше 4).</p>
        <p style="color:var(--muted)">Пересдача бесплатная — повтори слова и попробуй снова.</p>
      </div>
      <button class="btn gold full" style="margin-bottom:10px" onclick="startLesson(${curL.id})">Пересдать экзамен</button>
      <button class="btn ghost full" onclick="switchTab('vocab')">Повторить слова в Словаре</button>`;
    return;
  }

  haptic('ok'); sfx('win'); fireConfetti();
  const wasFirst = !st.done.includes(curL.id);
  const rewards = calcLessonRewards(curL, !wasFirst);

  let cardHtml = '', vocabHtml = '';
  if (wasFirst) {
    st.done.push(curL.id);
    const newWords = (Array.isArray(VOCAB) ? VOCAB : []).filter(w => w.l === curL.id).length;
    if (newWords > 0) vocabHtml = `<p style="color:var(--cyan);font-weight:700">В словарь добавлено новых слов: +${newWords}</p>`;
    if (curL.cardId && Array.isArray(CARDS) && !st.cards.includes(curL.cardId)) {
      st.cards.push(curL.cardId);
      const c = CARDS.find(x => x.id === curL.cardId);
      if (c) cardHtml = `<p style="color:var(--gold);font-weight:800">Выбита карта: ${escapeHtml(c.name)} [${escapeHtml(c.r)}]</p>`;
    }
  }
  st.coins += rewards.coins;
  st.xp += rewards.xp;
  addWeeklyXp(rewards.xp);
  save();

  const stars = mistakes === 0 ? 'Идеально (0 ошибок)!' : (mistakes <= 2 ? 'Отлично!' : 'Засчитано (ошибок: ' + mistakes + ')');
  const rewardLine = wasFirst
    ? `Награда: <b>+${rewards.coins} микрофонов</b> и <b>+${rewards.xp} XP</b>`
    : `Повтор: <b>+${rewards.coins} микрофонов</b> и <b>+${rewards.xp} XP</b>`;
  document.getElementById('study-body').innerHTML = `
    <div class="card-box" style="text-align:center;padding:26px 18px">
      <h2 style="margin:0 0 6px">${curL.isExam ? 'Экзамен сдан!' : 'Урок пройден!'}</h2>
      <div style="color:var(--cyan);font-weight:700;margin-bottom:10px">${stars}</div>
      <p>${rewardLine}</p>
      ${vocabHtml}${cardHtml}
    </div>
    <button class="btn full" style="margin-bottom:10px" onclick="switchTab('lessons')">К урокам</button>
    <button class="btn ghost full" onclick="switchTab('vocab')">Открыть Словарь</button>`;
}

function renderRank() {}

/* Стартуем после загрузки JSON-данных, чтобы уроки и карты уже были на месте. */
function bootKpopLingua() {
  syncResources();
  renderLessons();
}

if (window.AppData) window.AppData.whenReady(bootKpopLingua);
else bootKpopLingua();

document.addEventListener('app:data-ready', function () {
  const active = document.querySelector('.screen.active');
  if (!active) return;
  if (active.id === 'screen-lessons') renderLessons();
  if (active.id === 'screen-vocab') renderVocab();
  if (active.id === 'screen-binder') renderBinder();
  if (active.id === 'screen-rank') renderRank();
});

setInterval(syncResources, 30000);
