<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-Pop Lingua</title>
<script src="https://telegram.org"></script>
<style>
:root { --bg: #12101c; --card: #1e1a2e; --accent: #ff2e93; --secondary: #8a2be2; --text: #ffffff; --muted: #a09cb0; --success: #00e676; }
* { box-sizing: border-box; font-family: sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; user-select: none; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1e1a2e; border-bottom: 1px solid #333; position: sticky; top: 0; }
.badge { background: rgba(255,46,147,0.15); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 20px; font-weight: bold; }
.screen { display: none; padding: 20px; }
.screen.active { display: block; }
.lesson-card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d2844; }
.lesson-card.completed { border-color: var(--success); }
.btn { background: linear-gradient(135deg, var(--accent), var(--secondary)); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; cursor: pointer; }
.theory-box { background: var(--card); padding: 20px; border-radius: 16px; line-height: 1.5; margin-bottom: 20px; }
.korean-word { font-size: 36px; font-weight: bold; text-align: center; margin: 20px 0; padding: 20px; background: rgba(138,43,226,0.2); border-radius: 16px; cursor: pointer; }
.option-btn { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 15px; }
.option-btn.correct { background: rgba(0,230,118,0.25); border-color: var(--success); }
.option-btn.wrong { background: rgba(255,46,147,0.25); border-color: var(--accent); }
.binder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.collect-card { background: var(--card); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid #333; }
.collect-card.locked { filter: grayscale(1) opacity(0.4); }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181526; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
.nav-item { color: var(--muted); font-size: 13px; cursor: pointer; }
.nav-item.active { color: var(--accent); font-weight: bold; }
</style>
</head>
<body>
<div class="header"><b>✨ K-Pop Lingua</b><div class="badge">🎤 <span id="coins">50</span></div></div>
<div id="screen-lessons" class="screen active"><h3>Путь трейни (Уроки)</h3><div id="lessons-list"></div></div>
<div id="screen-study" class="screen"><button class="btn" style="background:#333;margin-bottom:15px" onclick="switchTab('lessons')">← Назад</button><div id="study-content"></div></div>
<div id="screen-binder" class="screen"><h3>Твой Биндер</h3><button class="btn" style="width:100%;margin-bottom:15px" onclick="buyPack()">🎁 Открыть пак (50 🎤)</button><div class="binder-grid" id="binder-grid"></div></div>
<div class="nav"><div class="nav-item active" id="nav-lessons" onclick="switchTab('lessons')">📚 Уроки</div><div class="nav-item" id="nav-binder" onclick="switchTab('binder')">🃏 Биндер</div></div>
<script>
if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.expand();
const LESSONS = [
  { id: 1, title: "Глава 1. Хангыль: Первые буквы", desc: "Читаем имя Лисы из BLACKPINK", coins: 50, card: 1, theory: "<b>ㄹ</b> [Р/Л] + <b>ㅣ</b> [И] = <b>리 (Ли)</b>.<br><b>ㅅ</b> [С] + <b>ㅏ</b> [А] = <b>사 (Са)</b>.<br>Вместе: <b>리사 — Лиса!</b>", qs: [{ w: "리사", q: "Как читается это имя?", o: ["Лиса", "Джису", "Розэ"], c: 0 }, { w: "사", q: "Какой это слог?", o: ["Ри", "Са", "Ма"], c: 1 }] },
  { id: 2, title: "Глава 2. Слова из песен", desc: "Любовь и Супер", coins: 60, card: 2, theory: "<b>사랑해 (Саранхэ)</b> — Я тебя люблю.<br><b>대박 (Тэбак)</b> — Супер / Вау!", qs: [{ w: "사랑해", q: "Перевод фразы?", o: ["Доброе утро", "Я тебя люблю"], c: 1 }, { w: "대박", q: "Что значит слово?", o: ["Супер / Вау!", "Пока"], c: 0 }] }
];
const CARDS = [
  { id: 1, name: "Стажер Сеула", r: "R", e: "🎧" },
  { id: 2, name: "Неоновый Лайтстик", r: "SR", e: "🪄" },
  { id: 3, name: "Золотой Альбом", r: "SSR", e: "💿" },
  { id: 4, name: "Главный Вокалист", r: "SSR", e: "👑" }
];
let st = JSON.parse(localStorage.getItem('kp_st') || '{"coins":50,"done":[],"cards":[]}');
function save() { localStorage.setItem('kp_st', JSON.stringify(st)); document.getElementById('coins').innerText = st.coins; }
function speak(t) { if ('speechSynthesis' in window) { let u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; speechSynthesis.speak(u); } }
function switchTab(t) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + t).classList.add('active');
  document.getElementById('nav-' + t).classList.add('active');
  if (t === 'lessons') renderL();
  if (t === 'binder') renderB();
}
function renderL() {
  let el = document.getElementById('lessons-list'); el.innerHTML = '';
  LESSONS.forEach(l => {
    let d = st.done.includes(l.id);
    el.innerHTML += '<div class="lesson-card ' + (d ? 'completed' : '') + '"><div><b>' + (d ? '✅ ' : '') + l.title + '</b><br><small style="color:#aaa">' + l.desc + '</small></div><button class="btn" onclick="startL(' + l.id + ')">Учить</button></div>';
  });
}
let cur = null, qi = 0;
function startL(id) {
  cur = LESSONS.find(x => x.id === id); qi = 0; switchTab('study');
  document.getElementById('study-content').innerHTML = '<div class="theory-box">' + cur.theory + '</div><button class="btn" style="width:100%" onclick="nextQ()">К тесту →</button>';
}
function nextQ() {
  if (qi >= cur.qs.length) {
    if (!st.done.includes(cur.id)) { st.done.push(cur.id); st.coins += cur.coins; if (!st.cards.includes(cur.card)) st.cards.push(cur.card); save(); }
    document.getElementById('study-content').innerHTML = '<div class="theory-box" style="text-align:center"><h3>🔥 Урок пройден!</h3><p>+' + cur.coins + ' 🎤 и новая карточка!</p><button class="btn" style="width:100%" onclick="switchTab(\'binder\')">В Биндер</button></div>';
    return;
  }
  let q = cur.qs[qi];
  let h = '<div class="korean-word" onclick="speak(\'' + q.w + '\')">🔊 ' + q.w + '</div><h4>' + q.q + '</h4>';
  q.o.forEach((opt, i) => { h += '<button class="option-btn" onclick="ans(this,' + i + ',' + q.c + ')">' + opt + '</button>'; });
  document.getElementById('study-content').innerHTML = h;
  speak(q.w);
}
function ans(b, i, c) {
  if (i === c) { b.classList.add('correct'); setTimeout(() => { qi++; nextQ(); }, 700); }
  else { b.classList.add('wrong'); }
}
function renderB() {
  let g = document.getElementById('binder-grid'); g.innerHTML = '';
  CARDS.forEach(c => {
    let u = st.cards.includes(c.id);
    g.innerHTML += '<div class="collect-card ' + (u ? '' : 'locked') + '"><small>' + c.r + '</small><div style="font-size:42px;margin:10px 0">' + (u ? c.e : '❓') + '</div><b>' + (u ? c.name : 'Закрыто') + '</b></div>';
  });
}
function buyPack() {
  if (st.coins < 50) return alert('Нужно 50 🎤!');
  st.coins -= 50;
  let rc = CARDS[Math.floor(Math.random() * CARDS.length)];
  if (!st.cards.includes(rc.id)) { st.cards.push(rc.id); alert('Выпало: ' + rc.e + ' ' + rc.name); }
  else { st.coins += 20; alert('Повторка! +20 🎤'); }
  save(); renderB();
}
save(); renderL();
</script>
</body>
</html>
