<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-Pop Lingua</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg: #12101c; --card: #1e1a2e; --accent: #ff2e93; --secondary: #8a2be2; --text: #ffffff; --muted: #a09cb0; --success: #00e676; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; user-select: none; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(30, 26, 46, 0.9); border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 10; }
        .badge { background: rgba(255, 46, 147, 0.15); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .lesson-card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
        .lesson-card.completed { border-color: var(--success); }
        .lesson-info h3 { margin: 0 0 5px 0; font-size: 17px; }
        .lesson-info p { margin: 0; color: var(--muted); font-size: 13px; }
        .btn { background: linear-gradient(135deg, var(--accent), var(--secondary)); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .theory-box { background: var(--card); padding: 20px; border-radius: 16px; line-height: 1.5; margin-bottom: 20px; }
        .korean-word { font-size: 36px; font-weight: bold; text-align: center; margin: 20px 0; padding: 20px; background: rgba(138, 43, 226, 0.15); border-radius: 16px; cursor: pointer; }
        .korean-word span { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: normal; }
        .option-btn { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-size: 15px; cursor: pointer; }
        .option-btn.correct { background: rgba(0, 230, 118, 0.2); border-color: var(--success); }
        .option-btn.wrong { background: rgba(255, 46, 147, 0.2); border-color: var(--accent); }
        .binder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .collect-card { background: var(--card); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .collect-card.locked { filter: grayscale(1) opacity(0.4); }
        .collect-card.ssr { border: 2px solid #ffd700; }
        .card-emoji { font-size: 48px; margin: 10px 0; }
        .rarity { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.1); }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181526; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
        .nav-item { color: var(--muted); text-align: center; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
<div class="header">
    <div style="font-weight: 800; font-size: 18px;">✨ K-Pop Lingua</div>
    <div class="badge">🎤 <span id="coins">0</span></div>
</div>
<div id="screen-lessons" class="screen active">
    <h2 style="margin-top:0;">Путь трейни (Уроки)</h2>
    <div id="lessons-list"></div>
</div>
<div id="screen-study" class="screen">
    <button class="btn" style="background: #2b2640; margin-bottom: 15px;" onclick="switchTab('lessons')">← Назад</button>
    <div id="study-content"></div>
</div>
<div id="screen-binder" class="screen">
    <h2 style="margin-top:0;">Твой Биндер карточек</h2>
    <button class="btn" style="width:100%; margin-bottom: 20px;" onclick="buyPack()">🎁 Открыть K-Pop пак (50 🎤)</button>
    <div class="binder-grid" id="binder-grid"></div>
</div>
<div class="nav">
    <div class="nav-item active" id="nav-lessons" onclick="switchTab('lessons')">📚 Уроки</div>
    <div class="nav-item" id="nav-binder" onclick="switchTab('binder')">🃏 Биндер</div>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const LESSONS = [
        { id: 1, title: "Глава 1. Хангыль: Первые буквы", desc: "Читаем имя Лисы из BLACKPINK", rewardCoins: 50, rewardCardId: 1,
          theory: "<h3>Корейский алфавит как конструктор</h3><p><b>ㄹ</b> [Р/Л] + <b>ㅣ</b> [И] = <b>리 (Ли)</b>.<br><b>ㅅ</b> [С] + <b>ㅏ</b> [А] = <b>사 (Са)</b>.<br>Вместе: <b>리사 — Лиса!</b></p>",
          questions: [
            { word: "리사", hint: "Нажми для озвучки", q: "Как читается это имя?", options: ["Лиса", "Джису", "Розэ", "Дженни"], correct: 0 },
            { word: "사", hint: "ㅅ + ㅏ", q: "Какой это слог?", options: ["Ри", "Са", "Ма", "Но"], correct: 1 }
          ]
        },
        { id: 2, title: "Глава 2. Слова из песен", desc: "Любовь и Супер", rewardCoins: 60, rewardCardId: 2,
          theory: "<h3>Главные слова фаната</h3><p><b>사랑해 (Саранхэ)</b> — Я тебя люблю.<br><b>대박 (Тэбак)</b> — Супер / Вау!</p>",
          questions: [
            { word: "사랑해", hint: "Са-ран-хэ", q: "Перевод фразы?", options: ["Доброе утро", "Я тебя люблю", "Спасибо"], correct: 1 },
            { word: "대박", hint: "Тэ-бак", q: "Что значит это слово?", options: ["Супер / Вау!", "Пока", "Спать"], correct: 0 }
          ]
        }
    ];
    const CARDS = [
        { id: 1, name: "Стажер Сеула", rarity: "R", emoji: "🎧" },
        { id: 2, name: "Неоновый Лайтстик", rarity: "SR", emoji: "🪄" },
        { id: 3, name: "Золотой Альбом", rarity: "SSR", emoji: "💿" },
        { id: 4, name: "Главный Вокалист", rarity: "SSR", emoji: "👑" }
    ];
    let state = JSON.parse(localStorage.getItem('kpop_state')) || { coins: 50, completedLessons: [], unlockedCards: [] };
    function saveState() { localStorage.setItem('kpop_state', JSON.stringify(state)); document.getElementById('coins').innerText = state.coins; }
    function speakKorean(t) { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = 0.85; speechSynthesis.speak(u); } }
    function switchTab(tab) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('screen-' + tab).classList.add('active');
        if (document.getElementById('nav-' + tab)) document.getElementById('nav-' + tab).classList.add('active');
        if (tab === 'lessons') renderLessons();
        if (tab === 'binder') renderBinder();
    }
    function renderLessons() {
        const list = document.getElementById('lessons-list'); list.innerHTML = '';
        LESSONS.forEach(l => {
            const done = state.completedLessons.includes(l.id);
            list.innerHTML += `<div class="lesson-card ${done ? 'completed' : ''}"><div class="lesson-info"><h3>${done ? '✅ ' : ''}${l.title}</h3><p>${l.desc} • +${l.rewardCoins} 🎤</p></div><button class="btn" onclick="startLesson(${l.id})">${done ? 'Повтор' : 'Учить'}</button></div>`;
        });
    }
    let curL = null, qIdx = 0;
    function startLesson(id) {
        curL = LESSONS.find(x => x.id === id); qIdx = 0; switchTab('study');
        document.getElementById('study-content').innerHTML = `<div class="theory-box">${curL.theory}</div><button class="btn" style="width:100%; padding:15px;" onclick="renderQ()">К тесту →</button>`;
    }
    function renderQ() {
        if (qIdx >= curL.questions.length) {
            if (!state.completedLessons.includes(curL.id)) {
                state.completedLessons.push(curL.id); state.coins += curL.rewardCoins;
                if (!state.unlockedCards.includes(curL.rewardCardId)) state.unlockedCards.push(curL.rewardCardId);
                saveState();
            }
            document.getElementById('study-content').innerHTML = `<div class="theory-box" style="text-align:center;"><h2>🔥 Урок пройден!</h2><p>+${curL.rewardCoins} 🎤 и новая карточка!</p><button class="btn" style="width:100%;" onclick="switchTab('binder')">В Биндер</button></div>`;
            return;
        }
        const q = curL.questions[qIdx];
        let opts = q.options.map((o, i) => `<button class="option-btn" onclick="checkA(this, ${i}, ${q.correct})">${o}</button>`).join('');
        document.getElementById('study-content').innerHTML = `<div class="korean-word" onclick="speakKorean('${q.word}')">🔊 ${q.word}<span>${q.hint}</span></div><h3>${q.q}</h3>${opts}`;
        speakKorean(q.word);
    }
    function checkA(btn, c, cor) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        if (c === cor) { btn.classList.add('correct'); setTimeout(() => { qIdx++; renderQ(); }, 800); }
        else { btn.classList.add('wrong'); setTimeout(() => { renderQ(); }, 900); }
    }
    function renderBinder() {
        const g = document.getElementById('binder-grid'); g.innerHTML = '';
        CARDS.forEach(c => {
            const u = state.unlockedCards.includes(c.id);
            g.innerHTML += `<div class="collect-card ${u ? '' : 'locked'} ${c.rarity === 'SSR' ? 'ssr' : ''}"><span class="rarity">${c.rarity}</span><div class="card-emoji">${u ? c.emoji : '❓'}</div><div style="font-weight:bold;">${u ? c.name : 'Закрыто'}</div></div>`;
        });
    }
    function buyPack() {
        if (state.coins < 50) return alert("Нужно 50 🎤!");
state.coins -= 50;
const rc = CARDS[Math.floor(Math.random() * CARDS.length)];
if (!state.unlockedCards.includes(rc.id)) { state.unlockedCards.push(rc.id); alert(Выпала карточка: ${rc.emoji} ${rc.name}!); }
else { state.coins += 20; alert(Повторка! Возвращено +20 🎤); }
saveState(); renderBinder();
}
saveState(); renderLessons();
